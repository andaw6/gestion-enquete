<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-entity-loader
    [fetchDataFn]="loadDemande"
    [headerTitle]="'Détails de la Demande d\'Enquête'"
    [loadingTitle]="'Chargement de la demande...'"
    [loadingSubtitle]="'Récupération des informations d\'une demande'"
    [errorTitle]="'Impossible de charger la demande'"
    [backButtonText]="'Retour'"
    (goBack)="goBack()"
    (dataLoaded)="onDemandeLoaded($event)"
    (loadingState)="onLoadingStateChanged($event)"
    (errorState)="onLoadingError($event)"
  >
    <ng-template let-data>
      <ng-container *ngIf="data">
        <div
          class="mb-6 bg-white/80 glass-effect shadow-glass border-b border-secondary-200/50 sticky top-0 z-50 p-4 rounded-xl"
        >
          <app-breadcrumb
            [items]="breadcrumbItems()"
            class="mb-8 animate-fade-in-up block"
          >
          </app-breadcrumb>
          <app-page-header-1 [config]="headerConfig()" />
        </div>

        <div
          class="bg-white rounded-lg shadow-card p-4 sm:p-6 mb-8 animate-slide-up"
        >
          <div
            class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"
          >
            <!-- Section des badges/statuts -->
            <div
              class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4"
            >
              <app-status-badge *ngIf="demande()" [etat]="demande()!.etat" />
              <span
                *ngIf="demande()!.urgent"
                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800 w-fit"
              >
                <i class="fas fa-exclamation-triangle mr-2"></i>
                Urgent
              </span>

              <div class="flex items-center text-sm text-gray-500">
                <span class="mr-2">Priorité:</span>
                <span
                  [ngClass]="getPrioriteClass(demande()!.priorite)"
                  class="px-2 py-1 rounded-full text-sm font-medium"
                >
                  {{ getPrioriteLabel(demande()!.priorite) }}
                </span>
              </div>
            </div>

            <!-- Section des boutons -->
            <div
              class="flex flex-col sm:flex-row gap-2 sm:gap-3"
              *ngIf="canValidate()"
            >
              <button
                (click)="validate()"
                class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-lg transition-colors text-center"
              >
                <i class="fas fa-check mr-2"></i>Valider
              </button>

              <button
                (click)="update()"
                class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition-colors text-center"
              >
                <i class="fas fa-edit mr-2"></i>Modifier
              </button>

              <button
                (click)="annuler()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors text-center"
              >
                <i class="fas fa-times mr-2"></i>Annuler
              </button>
            </div>
          </div>
        </div>

        <div
          *ngIf="demande()!.commentaireValidation"
          class="mt-8 bg-white rounded-lg shadow-card p-6 animate-slide-up"
        >
          <h3
            class="text-xl font-semibold text-dark-900 mb-6 flex items-center"
          >
            <i class="fas fa-comments text-primary-500 mr-3"></i>
            Commentaires de validation
          </h3>
          <div
            class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg"
          >
            <p class="text-yellow-800">
              <i class="fas fa-info-circle mr-2"></i>
              {{ demande()!.commentaireValidation }}
            </p>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- Main Content Column -->
          <div class="lg:col-span-2 space-y-6">
            <div class="my-4">
              <app-informations-generales
                [demande]="demande()!"
              ></app-informations-generales>
            </div>
            <div class="my-4">
              <app-personne-concernee
                [concerne]="demande()!.concerne"
              ></app-personne-concernee>
            </div>
            <div class="my-4">
              <app-documents
                [documents]="demande()!.documents ?? []"
                (onPreview)="onPreview($event)"
                (onDownload)="onDownload($event)"
              ></app-documents>
            </div>
          </div>

          <!-- Sidebar -->
          <div class="space-y-6">
            <app-demande-sidebar [demande]="demande()!"></app-demande-sidebar>
          </div>
        </div>
      </ng-container>
    </ng-template>
  </app-entity-loader>
</main>

<!-- Preview Modal -->
<app-document-preview-modal
  [isModalOpen]="isPreviewModalOpen"
  [document]="selectedDocument"
  (modalClosed)="isPreviewModalOpen = false; selectedDocument = null"
></app-document-preview-modal>
