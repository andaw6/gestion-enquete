<div id="deleteModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50  flex items-center justify-center p-4">
  <div class="modal-content bg-white  rounded-xl max-w-md w-full p-6 shadow-2xl">
    <div class="flex items-center justify-center w-12 h-12 mx-auto bg-red-100  rounded-full mb-4">
      <svg class="w-6 h-6 text-red-600 " fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
        </path>
      </svg>
    </div>
    <h3 class="text-lg font-medium text-gray-900 text-center mb-2"> {{ data.title }}</h3>
    <p class="text-sm text-gray-500 dark:text-gray-400 text-center mb-6">
      {{ data.message }}
    </p>
    <div class="flex justify-center space-x-3">
      <button (click)="onNoClick()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
        Annuler
      </button>
      <button (click)="onConfirm()"
        class="px-4 py-2 text-sm font-medium bg-red-600 text-white hover:bg-red-700 rounded-lg transition-colors">
        Supprimer
      </button>
    </div>
  </div>
</div>
