<div
  class="bg-card border border-border rounded-xl shadow-professional-lg p-8 animate-slide-up"
>
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center">
      <div
        class="w-10 h-10 bg-secondary/10 rounded-lg flex items-center justify-center mr-4"
      >
        <svg
          class="w-5 h-5 text-secondary"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          ></path>
        </svg>
      </div>
      <h3 class="text-xl font-heading font-bold text-card-foreground">
        Documents joints
      </h3>
    </div>
    <span class="text-sm text-muted-foreground bg-muted px-3 py-1 rounded-full"
      >{{ documents.length }} fichier{{ documents.length > 1 ? "s" : "" }}</span
    >
  </div>

  <div class="space-y-4">
    <div
      *ngFor="let document of documents"
      class="flex items-center justify-between p-4 bg-muted rounded-lg hover:bg-muted/80 transition-colors group"
    >
      <div class="flex items-center space-x-4">
        <div
          class="w-12 h-12 rounded-lg flex items-center justify-center"
          [class.bg-red-100]="document.extension === 'pdf'"
          [class.bg-blue-100]="document.extension === 'docx'"
        >
          <svg
            class="w-6 h-6"
            [class.text-red-600]="document.extension === 'pdf'"
            [class.text-blue-600]="document.extension === 'docx'"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </div>
        <div>
          <p class="font-semibold text-card-foreground">{{ document.nom }}</p>
          <p class="text-sm text-muted-foreground">
            {{ formatFileSize(document.taille) }} • Ajouté le
            {{ formatDate(document.createdAt) }}
          </p>
        </div>
      </div>
      <button
        class="text-secondary hover:text-secondary/80 transition-colors opacity-0 group-hover:opacity-100"
        (click)="downloadDocument(document)"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</div>
