<!-- Barre de filtres -->
<div class="bg-white rounded-xl p-6 border border-gray-200 shadow-sm">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <!-- Recherche -->
    <div class="lg:col-span-2">
      <label class="block text-sm font-medium text-gray-700 mb-2">
        <i class="fas fa-search mr-1"></i>
        Rechercher
      </label>
      <input
        type="text"
        [(ngModel)]="filters.searchTerm"
        (ngModelChange)="applyFilters()"
        placeholder="Rechercher par objet ou description..."
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
      />
    </div>

    <!-- Filtre par catégorie -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        <i class="fas fa-folder mr-1"></i>
        Catégorie
      </label>
      <select
        [(ngModel)]="filters.categorie"
        (ngModelChange)="applyFilters()"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
      >
        <option value="">Toutes les catégories</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <!-- Filtre par état -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        <i class="fas fa-flag mr-1"></i>
        Priorité
      </label>
      <select
        [(ngModel)]="filters.priporite"
        (ngModelChange)="applyFilters()"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
      >
        <option value="">Tous les priorités</option>
        <option *ngFor="let etat of priorites" [value]="etat.value">
          {{ etat.label }}
        </option>
      </select>
    </div>

    <!-- Filtre par date -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        <i class="fas fa-calendar mr-1"></i>
        Date de début
      </label>
      <input
        type="date"
        [(ngModel)]="filters.dateDebut"
        (ngModelChange)="applyFilters()"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        <i class="fas fa-calendar mr-1"></i>
        Date de fin
      </label>
      <input
        type="date"
        [(ngModel)]="filters.dateFin"
        (ngModelChange)="applyFilters()"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
      />
    </div>

    <!-- Tri -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">
        <i class="fas fa-sort mr-1"></i>
        Trier par
      </label>
      <select
        [(ngModel)]="filters.sortBy"
        (ngModelChange)="applyFilters()"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
      >
        <option value="dateDesc">Date (plus récent)</option>
        <option value="dateAsc">Date (plus ancien)</option>
        <option value="objet">Objet (A-Z)</option>
        <option value="categorie">Catégorie</option>
      </select>
    </div>

    <!-- Bouton réinitialiser -->
    <div class="flex items-end">
      <button
        (click)="resetFilters()"
        class="w-full px-4 py-2 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition-colors flex items-center justify-center space-x-2"
      >
        <i class="fas fa-redo"></i>
        <span>Réinitialiser</span>
      </button>
    </div>
  </div>

  <!-- Résumé des filtres actifs -->
  <div *ngIf="hasActiveFilters()" class="mt-4 pt-4 border-t border-gray-200">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2 text-sm text-gray-600">
        <i class="fas fa-filter"></i>
        <span class="font-medium">{{ result }} résultat(s) trouvé(s)</span>
      </div>
      <div class="flex flex-wrap gap-2">
        <span
          *ngIf="filters.searchTerm"
          class="px-3 py-1 bg-primary-100 text-primary-700 rounded-full text-xs font-medium flex items-center space-x-1"
        >
          <span>Recherche: "{{ filters.searchTerm }}"</span>
          <button
            (click)="filters.searchTerm = ''; applyFilters()"
            class="ml-1 hover:text-primary-900"
          >
            <i class="fas fa-times"></i>
          </button>
        </span>
        <span
          *ngIf="filters.categorie"
          class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium flex items-center space-x-1"
        >
          <span>Catégorie: {{ filters.categorie }}</span>
          <button
            (click)="filters.categorie = ''; applyFilters()"
            class="ml-1 hover:text-blue-900"
          >
            <i class="fas fa-times"></i>
          </button>
        </span>
        <span
          *ngIf="filters.priorite"
          class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium flex items-center space-x-1"
        >
          <span>État: {{ getEtatLibelle(filters.priorite) }}</span>
          <button
            (click)="filters.priorite ''; applyFilters()"
            class="ml-1 hover:text-green-900"
          >
            <i class="fas fa-times"></i>
          </button>
        </span>
      </div>
    </div>
  </div>
</div>
