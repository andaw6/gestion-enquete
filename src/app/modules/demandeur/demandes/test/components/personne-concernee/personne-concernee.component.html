<div class="bg-white rounded-lg shadow-card p-6">
  <h2 class="text-xl font-semibold text-secondary-900 mb-4 flex items-center">
    <svg
      class="w-5 h-5 mr-2 text-primary-500"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
      ></path>
    </svg>
    Personne Concernée
  </h2>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div>
      <label class="block text-sm font-medium text-secondary-700 mb-1"
        >Type</label
      >
      <span
        [ngClass]="getTypeClass(concerne.type)"
        class="px-2 py-1 rounded-full text-sm font-medium"
      >
        {{ concerne.type }}
      </span>
    </div>
    <div *ngIf="concerne.numero">
      <label class="block text-sm font-medium text-secondary-700 mb-1"
        >Téléphone</label
      >
      <p class="text-secondary-900">{{ concerne.numero }}</p>
    </div>
    <div *ngIf="!!concerne.regionSocial">
      <label class="block text-sm font-medium text-secondary-700 mb-1"
        >Région Sociale</label
      >
      <p class="text-secondary-900">{{ concerne.regionSocial }}</p>
    </div>
  </div>
</div>
