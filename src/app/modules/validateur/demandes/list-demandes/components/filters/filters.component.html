<div class="bg-white rounded-2xl shadow-lg border border-gray-200 mb-6">
  <div
    class="bg-gradient-to-r from-slate-50 to-blue-50/30 px-6 py-5 border-b border-gray-200"
  >
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-white rounded-xl shadow-sm">
          <svg
            class="w-5 h-5 text-blue-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
            ></path>
          </svg>
        </div>
        <h2 class="text-lg font-bold text-slate-900">Filtres avancés</h2>
      </div>
      <button
        (click)="resetFilters()"
        class="px-4 py-2 text-sm font-semibold text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded-xl transition-all flex items-center gap-2"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          ></path>
        </svg>
        Réinitialiser
      </button>
    </div>
  </div>
  <div class="p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div>
        <label
          class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-blue-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.5a2 2 0 00-1 .267V5a2 2 0 002-2h-4a2 2 0 00-2 2v12.5"
            ></path>
          </svg>
          Statut
        </label>
        <select
          [(ngModel)]="filters.status"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-900 transition-all hover:border-blue-300 shadow-sm"
        >
          <option value="">Tous les statuts</option>
          <option value="PENDING">En attente</option>
          <option value="APPROVED">Approuvée</option>
          <option value="REJECTED">Rejetée</option>
        </select>
      </div>
      <div>
        <label
          class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-blue-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-2a6 6 0 0112 0v2z"
            ></path>
          </svg>
          Type de concerné
        </label>
        <select
          [(ngModel)]="filters.concerneType"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-900 transition-all hover:border-blue-300 shadow-sm"
        >
          <option value="">Tous les types</option>
          <option value="employeur">Employeur</option>
          <option value="travailleur">Travailleur</option>
          <option value="beneficiaire">Bénéficiaire</option>
        </select>
      </div>
      <div>
        <label
          class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-blue-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
          Demandeur
        </label>
        <input
          type="text"
          [(ngModel)]="filters.requester"
          placeholder="Nom du demandeur..."
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-900 transition-all placeholder-gray-400 hover:border-blue-300 shadow-sm"
        />
      </div>
      <div>
        <label
          class="block text-sm font-bold text-gray-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-blue-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            ></path>
          </svg>
          Période
        </label>
        <input
          type="date"
          [(ngModel)]="filters.date"
          class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-900 transition-all hover:border-blue-300 shadow-sm"
        />
      </div>
    </div>
  </div>
</div>
