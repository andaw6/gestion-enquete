<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-dark-900/60 modal-overlay flex items-center justify-center z-50 animate-fade-in"
  (click)="onOverlayClick($event)"
>
  <div
    [class]="modalClass"
    class="bg-white rounded-xl shadow-intense overflow-hidden animate-slide-up"
  >
    <ng-content></ng-content>
  </div>
</div>
