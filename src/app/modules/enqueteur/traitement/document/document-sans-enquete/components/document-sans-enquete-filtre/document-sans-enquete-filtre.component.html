<div class="bg-white  rounded-lg shadow border border-gray-200  p-4 mb-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-2">
      <div class="relative">
        <input
          type="text"
          placeholder="Rechercher un document..."
          [formControl]="searchControl"
          class="pl-10 pr-4 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900 w-80"
        />

        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fas fa-search text-gray-400"></i>
        </div>
      </div>
      <button
        (click)="onUploadClick()"
        class="px-4 py-2 bg-primary-500 text-white rounded-md hover:bg-primary-600 transition-colors"
      >
        <i class="fas fa-upload mr-2"></i>Télécharger
      </button>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <select
        [(ngModel)]="filters.filterType"
        (ngModelChange)="onFiltersChange()"
        class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-sm bg-white  text-gray-900 "
      >
        <option value="all">Tous les types</option>
        <option *ngFor="let opt of filterCategories" [value]="opt.value">{{ opt.label }}</option>
      </select>

      <select
        [(ngModel)]="filters.sortBy"
        (ngModelChange)="onFiltersChange()"
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white  text-gray-900 "
      >
        <option *ngFor="let tri of filterTries" [value]="tri.value">{{ tri.label }}</option>
      </select>

      <button
        (click)="setViewMode('grid')"
        [class]="'px-3 py-2 rounded-md transition-colors ' + (filters.viewMode === 'grid' ? 'bg-primary-500 text-white' : 'bg-gray-100  text-gray-700 hover:bg-gray-200 ')"
      >
        <i class="fas fa-th-large"></i>
      </button>

      <button
        (click)="setViewMode('list')"
        [class]="'px-3 py-2 rounded-md transition-colors ' + (filters.viewMode === 'list' ? 'bg-primary-500 text-white' : 'bg-gray-100  text-gray-700 hover:bg-gray-200 ')"
      >
        <i class="fas fa-list"></i>
      </button>
    </div>
  </div>
</div>
