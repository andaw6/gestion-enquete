<aside
  class="sidebar-mobile fixed lg:static inset-y-0 left-0 z-[60] w-80 gradient-sidebar border-r border-primary-300/30 flex flex-col shadow-xl lg:shadow-none h-full"
  [class.open]="isOpen" >

  <!-- User Profile Header - Fixe en haut -->
  <div class="p-4 sm:p-6 border-b border-white/50 flex-shrink-0">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <div
          class="w-16 h-16 bg-gradient-to-br from-primary to-primary-600 rounded-full flex items-center justify-center shadow-lg ring-2 ring-white/20">
          <span class="text-white font-bold text-xl">{{ user.initials }}</span>
        </div>
        <div>
          <h2 class="text-xl font-bold text-white">{{ user.name }}</h2>
          <p class="text-sm text-primary-100">{{ user.role }}</p>
        </div>
      </div>
      <!-- Close button for mobile -->
      <button class="lg:hidden text-white/70 hover:text-white p-2 rounded-lg hover:bg-white/10 transition-all duration-200" (click)="onCloseSidebar()">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Navigation - Zone scrollable -->
  <nav class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6">
    <div class="space-y-8">
      <div *ngFor="let section of navigationSections">
        <h3 class="text-xs font-semibold text-primary-100/80 uppercase tracking-wider mb-4">
          {{ section.title }}
        </h3>
        <ul class="space-y-2">
          <li *ngFor="let item of section.items">
            <app-sidebar-item [item]="item"></app-sidebar-item>
          </li>


        </ul>
      </div>
    </div>
  </nav>
