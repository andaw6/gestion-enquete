<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
  <div
    *ngFor="let card of statCards; let i = index"
    [style.animation-delay]="i * 0.1 + 's'"
    class="stat-card bg-white rounded-2xl shadow-card border border-gray-100 p-6 hover-lift animate-fade-in"
  >
    <div class="flex items-start justify-between">
      <!-- Partie texte -->
      <div>
        <p class="text-sm font-semibold text-gray-600 mb-1">
          {{ card.title }}
        </p>
        <p class="text-3xl font-bold mb-1" [ngClass]="card.bgColor">
          {{ card.value }}
        </p>

        <p
          class="text-xs font-medium flex items-center gap-1"
          [ngClass]="getTrendClass(card.trendType)"
          *ngIf="card.trend"
        >
          <i
            *ngIf="card.trendType === 'positive'"
            class="fas fa-arrow-up text-green-500"
          ></i>
          <i
            *ngIf="card.trendType === 'negative'"
            class="fas fa-arrow-down text-red-500"
          ></i>
          {{ card.trend }}
        </p>
      </div>

      <!-- Partie icône -->
      <div
        [ngClass]="[
          card.iconColor,
          'w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg animate-float'
        ]"
      >
        <i
          [class]="card.icon + ' text-2xl text-white'"
          [ngClass]="{ 'fa-spin': card.icon === 'fas fa-spinner' }"
        ></i>
      </div>
    </div>
  </div>
</div>
