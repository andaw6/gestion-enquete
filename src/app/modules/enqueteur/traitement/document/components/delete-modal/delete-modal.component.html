<!-- delete-modal.component.html -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 transition-all duration-300 ease-out"
  [class.opacity-0]="!isOpen"
  [class.opacity-100]="isOpen"
  [class.pointer-events-none]="!isOpen"
  [class.pointer-events-auto]="isOpen"
  *ngIf="isOpen || isClosing"
>
  <!-- Backdrop avec effet de flou -->
  <div
    class="absolute inset-0 bg-gradient-to-br from-black/40 via-black/50 to-black/60 backdrop-blur-sm transition-all duration-300"
    [class.opacity-0]="!isOpen"
    [class.opacity-100]="isOpen"
    (click)="onCancel()"
  ></div>

  <!-- Modal Container -->
  <div
    class="relative bg-white rounded-3xl shadow-2xl max-w-md w-full transform transition-all duration-300 ease-out"
    [class.scale-90]="!isOpen"
    [class.scale-100]="isOpen"
    [class.translate-y-4]="!isOpen"
    [class.translate-y-0]="isOpen"
  >
    <!-- Header avec icône -->
    <div class="flex flex-col items-center pt-8 pb-4 px-6">
      <!-- Icône d'alerte animée -->
      <div class="relative mb-4">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center animate-pulse">
          <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.732 15.5c-.77.833.192 2.5 1.732 2.5z">
            </path>
          </svg>
        </div>
        <!-- Cercle d'animation -->
        <div class="absolute inset-0 w-16 h-16 border-2 border-red-200 rounded-full animate-ping opacity-75"></div>
      </div>

      <!-- Titre -->
      <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">
        Confirmer la suppression
      </h2>
    </div>

    <!-- Contenu -->
    <div class="px-6 pb-6">
      <p class="text-gray-600 text-center leading-relaxed mb-8">
        Êtes-vous certain de vouloir supprimer
        <span class="font-semibold text-gray-900 bg-gray-100 px-2 py-1 rounded-lg">{{ itemName }}</span> ?
        <br>
        <span class="text-sm text-red-600 font-medium mt-2 block">
          ⚠️ Cette action est définitive et irréversible
        </span>
      </p>

      <!-- Boutons d'action -->
      <div class="flex flex-col sm:flex-row gap-3 sm:gap-2">
        <!-- Bouton Annuler -->
        <button
          (click)="onCancel()"
          class="flex-1 px-6 py-3 text-sm font-medium text-gray-700 bg-gray-100 rounded-xl
                 hover:bg-gray-200 hover:text-gray-900
                 focus:outline-none focus:ring-4 focus:ring-gray-200
                 transition-all duration-200 ease-out transform hover:scale-105 active:scale-95"
        >
          <span class="flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            Annuler
          </span>
        </button>

        <!-- Bouton Supprimer -->
        <button
          (click)="onConfirm()"
          [disabled]="isDeleting"
          class="flex-1 px-6 py-3 text-sm font-medium text-white bg-gradient-to-r from-red-600 to-red-700 rounded-xl
                 hover:from-red-700 hover:to-red-800 hover:shadow-lg hover:shadow-red-500/25
                 focus:outline-none focus:ring-4 focus:ring-red-200
                 disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:shadow-none
                 transition-all duration-200 ease-out transform hover:scale-105 active:scale-95"
        >
          <span class="flex items-center justify-center gap-2">
            <!-- Spinner de chargement -->
            <svg *ngIf="isDeleting" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <!-- Icône de suppression -->
            <svg *ngIf="!isDeleting" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
              </path>
            </svg>
            {{ isDeleting ? 'Suppression...' : 'Supprimer' }}
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
