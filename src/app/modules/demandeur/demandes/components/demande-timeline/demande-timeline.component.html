<div
  class="bg-card border border-border rounded-xl shadow-professional p-6 animate-slide-up"
>
  <h3
    class="text-lg font-heading font-bold text-card-foreground mb-4 flex items-center"
  >
    <svg
      class="w-5 h-5 mr-2 text-secondary"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
      ></path>
    </svg>
    Chronologie
  </h3>
  <div class="space-y-4">
    <div class="flex items-start space-x-3">
      <div class="w-3 h-3 bg-secondary rounded-full mt-1 flex-shrink-0"></div>
      <div>
        <p class="text-sm font-semibold text-card-foreground">Demande créée</p>
        <p class="text-xs text-muted-foreground">
          {{ formatDateTime(demande.createdAt) }}
        </p>
      </div>
    </div>
    <div class="flex items-start space-x-3">
      <div class="w-3 h-3 bg-yellow-500 rounded-full mt-1 flex-shrink-0"></div>
      <div>
        <p class="text-sm font-semibold text-card-foreground">
          Documents ajoutés
        </p>
        <p class="text-xs text-muted-foreground">
          {{ formatDateTime(demande.updatedAt) }}
        </p>
      </div>
    </div>
    <div class="flex items-start space-x-3">
      <div class="w-3 h-3 bg-border rounded-full mt-1 flex-shrink-0"></div>
      <div>
        <p class="text-sm text-muted-foreground">En attente de validation</p>
        <p class="text-xs text-muted-foreground">
          Depuis le {{ formatDate(demande.updatedAt) }}
        </p>
      </div>
    </div>
  </div>
</div>
