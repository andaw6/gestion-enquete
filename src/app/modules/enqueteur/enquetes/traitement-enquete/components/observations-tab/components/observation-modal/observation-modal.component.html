<div
  *ngIf="open"
  id="observationModal"
  class="modal fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
>
  <div
    class="bg-white rounded-2xl shadow-intense max-w-2xl w-full max-h-[90vh] overflow-y-auto"
  >
    <!-- Header -->
    <div class="p-6 border-b border-gray-200">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-semibold text-gray-900">
          Nouvelle observation
        </h3>
        <button (click)="onClose()" class="text-gray-400 hover:text-gray-600">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Backend Errors -->
    <div *ngIf="!!backendError" class="p-6">
      <div
        class="bg-red-100 text-red-700 border border-red-300 rounded-lg p-4 space-y-2"
      >
        <!-- <div *ngFor="let err of backendErrors">{{ err }}</div> -->
         <div>{{backendError}}</div>
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSave()" class="p-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Titre -->
        <div>
          <label class="block text-sm font-medium text-gray-700">
            Titre de l'observation
          </label>
          <input
            type="text"
            formControlName="title"
            class="w-full px-4 py-3 border rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-primary-500 transition-all"
            placeholder="Titre descriptif..."
          />
          <div
            *ngIf="
              form.controls['title'].touched && form.controls['title'].invalid
            "
            class="text-red-500 text-sm mt-1"
          >
            Le titre est requis
          </div>
        </div>

        <!-- Catégorie -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Catégorie
          </label>
          <select
            formControlName="category"
            class="w-full px-4 py-3 border rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-primary-500 transition-all"
          >
            <option
              *ngFor="let option of categoryOptions"
              [value]="option.value"
            >
              {{ option.label }}
            </option>
          </select>
          <div
            *ngIf="
              form.controls['category'].touched &&
              form.controls['category'].invalid
            "
            class="text-red-500 text-sm mt-1"
          >
            La catégorie est requise
          </div>
        </div>
      </div>

      <!-- Priorité / Date / Heure -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Priorité
          </label>
          <select
            formControlName="priority"
            class="w-full px-4 py-3 border rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-primary-500 transition-all"
          >
            <option
              *ngFor="let option of priorityOptions"
              [value]="option.value"
            >
              {{ option.label }}
            </option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Date
          </label>
          <input
            type="date"
            formControlName="date"
            class="w-full px-4 py-3 border rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-primary-500 transition-all"
          />
          <div
            *ngIf="
              form.controls['date'].touched && form.controls['date'].invalid
            "
            class="text-red-500 text-sm mt-1"
          >
            La date est requise
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Heure
          </label>
          <input
            type="time"
            formControlName="time"
            class="w-full px-4 py-3 border rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-primary-500 transition-all"
          />
          <div
            *ngIf="
              form.controls['time'].touched && form.controls['time'].invalid
            "
            class="text-red-500 text-sm mt-1"
          >
            L'heure est requise
          </div>
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Description détaillée
        </label>
        <textarea
          rows="5"
          formControlName="description"
          class="w-full px-4 py-3 border rounded-lg bg-white text-gray-900 focus:ring-2 focus:ring-primary-500 transition-all"
          placeholder="Décrivez votre observation en détail..."
        ></textarea>
        <div
          *ngIf="
            form.controls['description'].touched &&
            form.controls['description'].invalid
          "
          class="text-red-500 text-sm mt-1"
        >
          La description est requise (min. 10 caractères)
        </div>
      </div>

      <!-- Actions -->
      <div class="border-t border-gray-200 pt-6 flex justify-end space-x-3">
        <button
          type="button"
          (click)="onClose()"
          class="px-6 py-3 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors"
        >
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="form.invalid"
          class="px-6 py-3 bg-gradient-to-r from-primary-500 to-primary-600 text-white hover:from-primary-600 hover:to-primary-700 rounded-lg transition-all shadow-soft"
        >
          Ajouter l'observation
        </button>
      </div>
    </form>
  </div>
</div>
