<div class="space-y-6">
  <!-- Préférences d'enquêtes -->
  <div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-medium text-gray-900">Préférences d'enquêtes</h3>
      <p class="text-sm text-gray-500">Configurez vos préférences de travail</p>
    </div>
    <div class="p-6">
      <form [formGroup]="enquetesForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Types d'enquêtes préférées</label>
          <div class="space-y-2">
            <label class="flex items-center">
              <input type="checkbox" formControlName="employeurs" class="w-4 h-4 ..." />
              <span class="ml-2 text-sm text-gray-700">Enquêtes employeurs</span>
            </label>
            <label class="flex items-center">
              <input type="checkbox" formControlName="travailleurs" class="w-4 h-4 ..." />
              <span class="ml-2 text-sm text-gray-700">Enquêtes travailleurs</span>
            </label>
            <label class="flex items-center">
              <input type="checkbox" formControlName="beneficiaires" class="w-4 h-4 ..." />
              <span class="ml-2 text-sm text-gray-700">Enquêtes bénéficiaires</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Charge de travail maximale</label>
          <select formControlName="maxWorkload" class="w-full px-3 py-2 border ...">
            <option [value]="5">5 enquêtes simultanées</option>
            <option [value]="10">10 enquêtes simultanées</option>
            <option [value]="15">15 enquêtes simultanées</option>
            <option [value]="20">20 enquêtes simultanées</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Délai de réponse pour acceptation</label>
          <select formControlName="responseDelay" class="w-full px-3 py-2 border ...">
            <option [value]="24">24 heures</option>
            <option [value]="48">48 heures</option>
            <option [value]="72">72 heures</option>
            <option [value]="168">1 semaine</option>
          </select>
        </div>

        <div>
          <label class="flex items-center">
            <input type="checkbox" formControlName="autoAcceptLowPriority" class="w-4 h-4 ..." />
            <span class="ml-2 text-sm text-gray-700">Accepter automatiquement les enquêtes de priorité basse</span>
          </label>
        </div>

        <div>
          <label class="flex items-center">
            <input type="checkbox" formControlName="acceptOutsideHours" class="w-4 h-4 ..." />
            <span class="ml-2 text-sm text-gray-700">Recevoir des enquêtes en dehors des heures de travail</span>
          </label>
        </div>
      </form>
    </div>
  </div>

  <!-- Horaires de travail -->
  <div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-medium text-gray-900">Horaires de travail</h3>
      <p class="text-sm text-gray-500">Définissez vos heures de disponibilité</p>
    </div>
    <div class="p-6">
      <!-- 💡 Ajout d'un form ici aussi -->
      <form [formGroup]="enquetesForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Heure de début</label>
            <input type="time" formControlName="startTime" [class]="getInputClass('startTime')" class="w-full px-3 py-2 border rounded-md">
            <div *ngIf="isFieldInvalid('startTime')" class="mt-1 text-sm text-red-600">
              <div *ngIf="enquetesForm.get('startTime')?.errors?.['required']">L'heure de début est requise</div>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Heure de fin</label>
            <input type="time" formControlName="endTime" [class]="getInputClass('endTime')" class="w-full px-3 py-2 border rounded-md">
            <div *ngIf="isFieldInvalid('endTime')" class="mt-1 text-sm text-red-600">
              <div *ngIf="enquetesForm.get('endTime')?.errors?.['required']">L'heure de fin est requise</div>
            </div>
          </div>
        </div>

        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Jours de travail</label>
          <div class="flex flex-wrap gap-2">
            <label class="flex items-center"><input type="checkbox" formControlName="lundi" class="w-4 h-4 ..." /><span class="ml-2 text-sm">Lundi</span></label>
            <label class="flex items-center"><input type="checkbox" formControlName="mardi" class="w-4 h-4 ..." /><span class="ml-2 text-sm">Mardi</span></label>
            <label class="flex items-center"><input type="checkbox" formControlName="mercredi" class="w-4 h-4 ..." /><span class="ml-2 text-sm">Mercredi</span></label>
            <label class="flex items-center"><input type="checkbox" formControlName="jeudi" class="w-4 h-4 ..." /><span class="ml-2 text-sm">Jeudi</span></label>
            <label class="flex items-center"><input type="checkbox" formControlName="vendredi" class="w-4 h-4 ..." /><span class="ml-2 text-sm">Vendredi</span></label>
            <label class="flex items-center"><input type="checkbox" formControlName="samedi" class="w-4 h-4 ..." /><span class="ml-2 text-sm">Samedi</span></label>
            <label class="flex items-center"><input type="checkbox" formControlName="dimanche" class="w-4 h-4 ..." /><span class="ml-2 text-sm">Dimanche</span></label>
          </div>
        </div>

        <!-- Messages -->
        <div *ngIf="successMessage()" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-md">
          <div class="flex"><i class="fas fa-check-circle text-green-400 mr-2 mt-0.5"></i><p class="text-sm text-green-800">{{ successMessage() }}</p></div>
        </div>

        <div *ngIf="errorMessage()" class="mt-6 p-4 bg-red-50 border border-red-200 rounded-md">
          <div class="flex"><i class="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i><p class="text-sm text-red-800">{{ errorMessage() }}</p></div>
        </div>

        <div class="flex justify-end mt-6">
          <button type="submit" [disabled]="enquetesForm.invalid || isSubmitting()" class="px-6 py-2 bg-primary-500 text-white rounded-md hover:bg-primary-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <span *ngIf="isSubmitting()" class="inline-flex items-center"><i class="fas fa-spinner fa-spin mr-2"></i>Enregistrement...</span>
            <span *ngIf="!isSubmitting()">Enregistrer les préférences</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
