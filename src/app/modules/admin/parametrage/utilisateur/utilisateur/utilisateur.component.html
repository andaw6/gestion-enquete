<div class="container mx-auto px-6 py-8">
  <!-- Header -->
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-dark-900">Gestion des utilisateurs</h1>
      <p class="text-gray-600 mt-1">Gérez tous les utilisateurs du système</p>
    </div>
    <div class="flex space-x-3">
      <button
        (click)="onNewUser()"
        class="flex items-center space-x-2 bg-primary hover:bg-primary-600 text-white px-4 py-2 rounded-lg transition-colors duration-200">
        <i class="fas fa-user-plus"></i>
        <span>Nouveau utilisateur</span>
      </button>
      <button
        (click)="onBulkImport()"
        class="flex items-center space-x-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg transition-colors duration-200">
        <i class="fas fa-upload"></i>
        <span>Import en masse</span>
      </button>
    </div>
  </div>

  <!-- Statistics Cards -->
  <app-stats-cards [stats]="stats"></app-stats-cards>

  <!-- Search and Filters -->
  <app-search-filters
    [filters]="filters"
    (filtersChange)="onFiltersChange($event)">
  </app-search-filters>

  <!-- Users Table -->
  <app-users-table
    [users]="filteredUsers"
    [pagination]="pagination"
    (userAction)="onUserAction($event.action, $event.user)"
    (paginationChange)="onPaginationChange($event)">
  </app-users-table>
</div>
