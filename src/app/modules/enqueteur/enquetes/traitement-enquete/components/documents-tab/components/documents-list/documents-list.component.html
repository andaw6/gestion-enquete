<!-- Liste des documents -->
<div class="space-y-4" *ngIf="documents.length > 0">
  <h4 class="text-md font-medium text-gray-700">
    Documents existants ({{ documents.length }})
  </h4>
  <div class="grid gap-3">
    <div
      *ngFor="let document of paginatedDocuments; trackBy: trackByDocumentId"
      class="bg-white rounded-lg p-4 border border-gray-200 hover:shadow-md hover:border-gray-300 transition-all duration-200"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="flex-shrink-0">
            <div
              [class]="utilService.getBgIcon(document.extension)"
              class="ml-3 w-12 h-12 rounded-lg flex items-center justify-center"
            >
              <i
                [class]="
                  utilService.getIcon(document.extension, false) + ' text-2xl'
                "
              ></i>
            </div>
          </div>
          <div class="min-w-0 flex-1">
            <h4 class="font-medium text-gray-900 truncate">
              {{ document.nom }}
            </h4>
            <p class="text-sm text-gray-500">
              <span *ngIf="document.createdAt"
                >Ajouté le {{ formatDate(document.createdAt) }}</span
              >
              <span *ngIf="document.taille">
                • {{ utilService.formatFileSize(document.taille) }}</span
              >
            </p>
            <p
              *ngIf="document.description"
              class="text-xs text-gray-400 mt-1 truncate"
            >
              {{ document.description }}
            </p>
          </div>
        </div>

        <div class="flex items-center space-x-2">
          <button
            (click)="viewDocument.emit(document)"
            class="p-2 text-gray-400 hover:text-blue-600 rounded-lg hover:bg-blue-50 transition-all duration-150"
            title="Aperçu"
            *ngIf="canPreview(document)"
          >
            <i class="fas fa-eye w-4 h-4"></i>
          </button>

          <button
            (click)="downloadDocument.emit(document)"
            class="p-2 text-gray-400 hover:text-green-600 rounded-lg hover:bg-green-50 transition-all duration-150"
            title="Télécharger"
          >
            <i class="fas fa-download w-4 h-4"></i>
          </button>

          <button
            (click)="deleteDocument.emit(document)"
            class="p-2 text-gray-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition-all duration-150"
            title="Supprimer"
          >
            <i class="fas fa-trash w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <div>
      <app-pagination
        [pagination]="pagination"
        (pageChanged)="setPage($event)"
      ></app-pagination>
    </div>
  </div>
</div>

<!-- Message si aucun document -->
<div
  *ngIf="documents.length === 0"
  class="text-center py-16 bg-gray-50 rounded-xl"
>
  <i class="fas fa-file-alt text-4xl text-gray-400 mb-4"></i>
  <h3 class="text-lg font-medium text-gray-900 mb-2">Aucun document</h3>
  <p class="text-gray-500 mb-4">
    Commencez par ajouter un document à cette enquête.
  </p>
  <div class="flex justify-center space-x-3">
    <button
      (click)="openExistingDocumentsModal.emit()"
      class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
    >
      Associer un document existant
    </button>
    <button
      (click)="openUploadModal.emit()"
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
    >
      Ajouter le premier document
    </button>
  </div>
</div>
