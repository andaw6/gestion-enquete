<div class="bg-gray-50">
  <!-- Page header -->
  <div class="gradient-bg mb-2 rounded-lg shadow-sm border-b border-gray-200">
    <div class="px-6 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-2xl font-bold text-white">Planning</h2>
          <p class="mt-1 text-sm text-primary-100">Gestion de votre planning d'enquêtes</p>
        </div>
        <div class="flex space-x-3">
          <!-- Vue selector -->
          <div class="flex bg-gray-100 rounded-lg p-1 gap-2">
            <button
              (click)="switchView('day')"
              [class]="getViewButtonClass('day')">
              Jour
            </button>
            <button
              (click)="switchView('week')"
              [class]="getViewButtonClass('week')">
              Semaine
            </button>
            <button
              (click)="switchView('month')"
              [class]="getViewButtonClass('month')">
              Mois
            </button>
          </div>

          <button
            (click)="openEventModal()"
            class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-500 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500">
            <i class="fas fa-plus mr-2"></i>
            Nouvel Événement
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="flex h-[calc(100vh-15rem)] pb-2">
    <!-- Calendar main area -->
    <div class="flex-1 ">
      <app-planning-calendar
        [currentView]="currentView()"
        (dateSelected)="onDateSelected($event)"
        (eventClick)="onEventClick($event)"
      ></app-planning-calendar>
    </div>

    <!-- Right sidebar -->
    <app-planning-sidebar></app-planning-sidebar>
  </div>

  <!-- Modal -->
  <app-planning-modal
    [isOpen]="isModalOpen()"
    [selectedDate]="selectedDate()"
    (close)="closeEventModal()"
    (eventCreated)="onEventCreated()"
  ></app-planning-modal>
</div>
