<div>
  <div
    class="bg-dark-50 rounded-lg p-4 max-h-80 overflow-y-auto scrollbar-thin"
  >
    <div class="space-y-2">
      <label
        *ngFor="let doc of documents"
        class="flex items-center p-3 bg-white rounded-lg hover:bg-primary-50 cursor-pointer transition-colors border border-transparent hover:border-primary-200"
      >
        <input
          type="checkbox"
          (change)="onDocChange($event, doc.id)"
          [checked]="selectedDocIds.includes(doc.id)"
          class="w-4 h-4 text-primary border-dark-300 rounded focus:ring-primary"
        />

        <div
          [class]="utilService.getBgIcon(doc.extension)"
          class="ml-3 w-10 h-10 rounded-lg flex items-center justify-center"
        >
          <i
            [class]=" utilService.getIcon(doc.extension, false) + ' text-lg'
            "
          ></i>
        </div>

        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-medium text-dark-800 truncate">
            {{ doc.nom }}
          </p>
          <div class="flex items-center space-x-3 text-xs text-dark-500 mt-1">
            <span>{{ utilService.formatFileSize(doc.taille) }}</span>
            <span>•</span>
            <span>{{ doc.type }}</span>
            <span>•</span>
            <span>{{ utilService.formatDate(doc.createdAt) }}</span>
          </div>
        </div>
      </label>

      <div *ngIf="documents.length === 0" class="text-center py-8">
        <i class="fas fa-folder-open text-4xl text-dark-300 mb-2"></i>
        <p class="text-sm text-dark-400">Aucun document disponible</p>
      </div>
    </div>
  </div>

  <!-- Compteur de documents sélectionnés -->
  <div
    *ngIf="selectedDocIds.length > 0"
    class="mt-3 text-sm text-primary font-medium"
  >
    <i class="fas fa-check-circle mr-1"></i>
    {{ selectedDocIds.length }} document(s) sélectionné(s)
  </div>
</div>
