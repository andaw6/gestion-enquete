<div class="bg-white rounded-xl card-shadow-lg border border-gray-100 overflow-hidden">
  <div class="bg-gradient-to-r from-primary-50 to-primary-100 px-6 py-4 border-b border-primary-200">
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-semibold text-primary-800 flex items-center">
        <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center mr-3">
          <i class="fas fa-info-circle text-white text-sm"></i>
        </div>
        Informations de la Source
      </h2>
      <div class="flex items-center space-x-2">
            <span class="px-3 py-1 bg-primary-600 text-white text-xs font-semibold rounded-full">
              ID: {{ source.id }}
            </span>
      </div>
    </div>
  </div>

  <div class="p-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-dark-600 mb-2 uppercase tracking-wide">Identification</label>
          <p class="text-lg font-medium text-dark-900 bg-gray-50 p-3 rounded-lg">
            {{ source.nom }}
          </p>
        </div>
        <div>
          <label class="block text-sm font-semibold text-dark-600 mb-2 uppercase tracking-wide">Niveau de Fiabilité</label>
          <div class="flex items-center space-x-2">
            <div class="flex items-center space-x-1">
              <i
                *ngFor="let star of getStars()"
                [class]="star ? 'fas fa-star text-yellow-400' : 'far fa-star text-yellow-400'"
              ></i>
            </div>
            <span class="px-3 py-1 bg-green-100 text-green-800 text-sm font-semibold rounded-full">
                  {{ getNiveauFiabilite() }}
                </span>
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-dark-600 mb-2 uppercase tracking-wide">Classification</label>
          <div class="flex items-center space-x-2">
                <span class="px-3 py-1 bg-blue-100 text-blue-800 text-sm font-semibold rounded-full">
                  <i class="fas fa-user-secret mr-1"></i>{{ source.type.libelle }}
                </span>
            <span class="px-3 py-1 bg-green-100 text-green-800 text-sm font-semibold rounded-full">
                  <i class="fas fa-check-circle mr-1"></i>{{ source.etat.libelle }}
                </span>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-dark-600 mb-2 uppercase tracking-wide">Priorité</label>
          <span class="px-3 py-1 bg-red-100 text-red-800 text-sm font-semibold rounded-full">
                <i class="fas fa-exclamation-triangle mr-1"></i>Critique
              </span>
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-dark-600 mb-2 uppercase tracking-wide">Description Détaillée</label>
        <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-primary-500">
          <p class="text-dark-700 leading-relaxed">
            {{ source.description }}
          </p>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-dark-600 mb-2 uppercase tracking-wide">Observations de l'Enquêteur</label>
        <div class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">
          <p class="text-dark-700 leading-relaxed">
            {{ source.commentaires }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
