<div
  class="bg-white rounded-2xl shadow-card border border-dark-100 mb-6 overflow-hidden animate-slide-up"
>
  <div
    class="bg-gradient-to-r from-secondary-50 to-primary-50 px-6 py-5 border-b border-dark-100"
  >
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-white rounded-xl shadow-sm">
          <svg
            class="w-5 h-5 text-primary"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
            />
          </svg>
        </div>
        <h2 class="text-lg font-bold text-secondary-900">Filtres avancés</h2>
      </div>
      <button
        (click)="resetFilters()"
        class="px-4 py-2 text-sm font-semibold text-primary hover:text-primary-700 hover:bg-primary-50 rounded-xl transition-all flex items-center gap-2"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          />
        </svg>
        Réinitialiser
      </button>
    </div>
  </div>
  <div class="p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <div>
        <label
          class="block text-sm font-bold text-dark-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-primary"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
            />
          </svg>
          Statut
        </label>
        <select
          [(ngModel)]="filters.statut"
          (ngModelChange)="onFilterChange()"
          class="w-full border-2 border-dark-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white text-dark-900 transition-all hover:border-primary-300 shadow-sm"
        >
          <option value="">Tous les statuts</option>
          <option value="00">En attente</option>
          <option value="01">Approuvée</option>
          <option value="02">Rejetée</option>
          <option value="03">En complément</option>
          <option value="04">Annulée</option>
        </select>
      </div>

      <div>
        <label
          class="block text-sm font-bold text-dark-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-primary"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          Type de concerné
        </label>
        <select
          [(ngModel)]="filters.typeConcerne"
          (ngModelChange)="onFilterChange()"
          class="w-full border-2 border-dark-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white text-dark-900 transition-all hover:border-primary-300 shadow-sm"
        >
          <option value="">Tous les types</option>
          <option value="employeur">Employeur</option>
          <option value="travailleur">Travailleur</option>
          <option value="beneficiaire">Bénéficiaire</option>
        </select>
      </div>

      <div>
        <label
          class="block text-sm font-bold text-dark-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-primary"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          Demandeur
        </label>
        <input
          type="text"
          [(ngModel)]="filters.demandeur"
          (ngModelChange)="onFilterChange()"
          placeholder="Nom du demandeur..."
          class="w-full border-2 border-dark-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white text-dark-900 transition-all placeholder-dark-400 hover:border-primary-300 shadow-sm"
        />
      </div>

      <div>
        <label
          class="block text-sm font-bold text-dark-700 mb-2 flex items-center gap-2"
        >
          <svg
            class="w-4 h-4 text-primary"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
          Période
        </label>
        <input
          type="date"
          [(ngModel)]="dateInput"
          (ngModelChange)="onDateChange()"
          class="w-full border-2 border-dark-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white text-dark-900 transition-all hover:border-primary-300 shadow-sm"
        />
      </div>
    </div>
  </div>
</div>
