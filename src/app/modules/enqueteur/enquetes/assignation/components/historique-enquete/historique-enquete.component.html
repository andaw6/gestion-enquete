<div
  class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-card border border-gray-200/50"
>
  <div
    class="px-8 py-6 border-b border-gray-200/50 bg-gradient-to-r from-gray-50/50 to-gray-100/50 rounded-t-2xl"
  >
    <div class="flex items-center justify-between">
      <h3 class="text-xl font-bold text-gray-900 flex items-center">
        <i class="fas fa-history text-blue-500 mr-3"></i>
        Historique de Mes Enquêtes
      </h3>
      <div class="flex items-center space-x-3">
        <select
          class="px-4 py-2 border-2 border-gray-200 rounded-xl text-sm bg-white text-gray-900 font-medium focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all duration-200"
          [(ngModel)]="selectedStatus"
          (change)="filterByStatus()"
        >
          <option value="">Tous les statuts</option>
          <option value="En cours">En cours</option>
          <option value="Terminées">Terminées</option>
          <option value="Refusées">Refusées</option>
        </select>
      </div>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gradient-to-r from-gray-50 to-gray-100">
        <tr>
          <th
            class="px-8 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider"
          >
            Enquête
          </th>
          <th
            class="px-8 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider"
          >
            Type
          </th>
          <th
            class="px-8 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider"
          >
            Assignée le
          </th>
          <th
            class="px-8 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider"
          >
            Statut
          </th>
          <th
            class="px-8 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider"
          >
            Progression
          </th>
          <th
            class="px-8 py-4 text-left text-xs font-bold text-gray-600 uppercase tracking-wider"
          >
            Actions
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr
          *ngFor="let enquete of enquetes"
          class="hover:bg-gradient-to-r hover:from-blue-50/30 hover:to-purple-50/30 transition-all duration-200"
        >
          <td class="px-8 py-6 whitespace-nowrap">
            <div class="text-base font-bold text-gray-900">
              {{ enquete.demande?.objet }}
            </div>
            <div class="text-sm text-gray-600">
              {{ enquete.demande!.concerne.type }}
            </div>
          </td>
          <td class="px-8 py-6 whitespace-nowrap">
            <span
              class="px-3 py-1 text-xs font-bold rounded-full"
              [ngClass]="getTypeColor(enquete.demande!.concerne.type)"
            >
              {{ getTypeLabel(enquete.demande!.concerne.type) }}
            </span>
          </td>
          <td
            class="px-8 py-6 whitespace-nowrap text-sm font-medium text-gray-600"
          >
            {{ enquete.dateAssignation }}
          </td>
          <td class="px-8 py-6 whitespace-nowrap">
            <span
              class="px-3 py-1 text-xs font-bold rounded-full"
              [ngClass]="getStatusColor(enquete.etat.code)"
            >
              {{ enquete.etat.libelle }}
            </span>
          </td>
          <td class="px-8 py-6 whitespace-nowrap">
            <div class="flex items-center space-x-3">
              <div class="w-20 bg-gray-200 rounded-full h-2">
                <div
                  class="h-2 rounded-full"
                  [ngClass]="getProgressColor(enquete.progression)"
                  [style.width.%]="enquete.progression"
                ></div>
              </div>
              <span
                class="text-sm font-bold"
                [ngClass]="
                  getProgressColor(enquete.progression).replace('bg-', 'text-')
                "
              >
                {{ enquete.progression }}%
              </span>
            </div>
          </td>
          <td class="px-8 py-6 whitespace-nowrap text-sm font-bold space-x-3">
            <button
              class="text-blue-600 hover:text-blue-800 transition-colors duration-200"
              (click)="continuerEnquete(enquete)"
            >
              {{ enquete.progression >= 90 ? "Finaliser" : "Continuer" }}
            </button>
            <button
              class="text-gray-600 hover:text-gray-800 transition-colors duration-200"
              (click)="voirEnquete(enquete)"
            >
              Voir
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
