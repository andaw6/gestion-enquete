<div class="bg-white rounded-lg shadow-card p-6">
  <h2 class="text-xl font-semibold text-secondary-900 mb-4 flex items-center">
    <svg
      class="w-5 h-5 mr-2 text-primary-500"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
      ></path>
    </svg>
    Documents Associés
  </h2>
  <div class="space-y-3" *ngIf="documents.length > 0; else noDocuments">
    <div
      *ngFor="let document of documents"
      class="flex items-center justify-between p-3 bg-gray-50 rounded-lg"
    >
      <div class="flex items-center">
        <svg
          [ngClass]="getDocumentIconClass(document.extension)"
          class="w-8 h-8 mr-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"
          ></path>
        </svg>
        <div>
          <p class="font-medium text-secondary-900">{{ document.nom }}</p>
          <p class="text-sm text-secondary-600">
            {{ document.taille }} • Ajouté le
            {{ document.createdAt| date : "dd/MM/yyyy" }}
          </p>
        </div>
      </div>
      <button
        (click)="onTelecharger(document)"
        class="text-primary-600 hover:text-primary-800 font-medium"
      >
        Télécharger
      </button>
    </div>
  </div>
  <ng-template #noDocuments>
    <p class="text-secondary-600 text-center py-4">Aucun document associé</p>
  </ng-template>
</div>
