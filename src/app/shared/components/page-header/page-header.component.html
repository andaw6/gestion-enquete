<div class="sticky top-0 z-50 gradient-bg rounded-lg shadow border border-gray-200" [class]="style">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white mb-2">{{ title }}</h1>
            <p *ngIf="subtitle" class="text-primary-100">{{ subtitle }}</p>
        </div>

        <!-- Bouton avec routerLink -->
        <button
                *ngIf="buttonText && buttonLink"
                class="px-4 py-2 bg-primary-500 text-white rounded-md hover:bg-primary-600 transition-colors shadow-md"
                [routerLink]="buttonLink"
        >
            <i *ngIf="buttonIcon" class="{{ buttonIcon }} mr-2"></i>
            {{ buttonText }}
        </button>

        <!-- Bouton avec action -->
        <button
                *ngIf="buttonText && !buttonLink && buttonAction"
                (click)="buttonAction()"
                class="px-4 py-2 bg-primary-500 text-white rounded-md hover:bg-primary-600 transition-colors"
        >
            <i *ngIf="buttonIcon" class="{{ buttonIcon }} mr-2"></i>
            {{ buttonText }}
        </button>
    </div>
</div>
