<div
  class="filter-card rounded-2xl shadow-card border border-gray-100 p-6 mb-8 animate-fade-in hover-lift"
>
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-xl font-bold text-secondary-600 flex items-center gap-2">
      <svg
        class="w-6 h-6 text-primary-500"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
        ></path>
      </svg>
      Filtres Avancés
    </h2>
    <span
      class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full font-medium"
      >4 filtres actifs</span
    >
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700"
        >Rechercher</label
      >
      <div class="relative">
        <input
          [(ngModel)]="filters.search"
          type="text"
          placeholder="Référence ou objet..."
          class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl bg-white text-gray-900 placeholder-gray-400 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500"
        />
        <svg
          class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
      </div>
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700">État</label>
      <select
        [(ngModel)]="filters.etat"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-white text-gray-900 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500"
      >
        <option value="">Tous les états</option>
        <option value="00">En attente</option>
        <option value="01">En cours</option>
        <option value="02">Terminée</option>
        <option value="06">Annulée</option>
      </select>
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700"
        >Période de début</label
      >
      <input
        [(ngModel)]="filters.dateDebut"
        type="date"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-white text-gray-900 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500"
      />
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700"
        >Progression</label
      >
      <select
        [(ngModel)]="filters.progression"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-white text-gray-900 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500"
      >
        <option value="">Tous</option>
        <option value="0-25">0-25%</option>
        <option value="25-50">25-50%</option>
        <option value="50-75">50-75%</option>
        <option value="75-100">75-100%</option>
      </select>
    </div>

    <div class="flex items-end gap-2">
      <button
        (click)="onFilter()"
        class="flex-1 gradient-primary text-white px-4 py-2.5 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          ></path>
        </svg>
        Filtrer
      </button>
      <button
        (click)="onReset()"
        class="px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-gray-700 font-semibold hover:bg-gray-50 transition-all duration-200"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</div>
