<div class="bg-white rounded-xl shadow-soft border border-gray-100 p-6 mb-8">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-4">
      <div class="relative">
        <input
          type="text"
          placeholder="Rechercher un document..."
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          class="pl-12 pr-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50 text-dark-900 w-80 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all duration-200">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i class="fas fa-search text-dark-400"></i>
        </div>
      </div>
      <button class="px-4 py-3 bg-primary-500 text-white rounded-xl hover:bg-primary-600 transition-all duration-200 shadow-lg hover:shadow-xl">
        <i class="fas fa-upload mr-2"></i>Télécharger
      </button>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <select
        [(ngModel)]="selectedInvestigation"
        (change)="onInvestigationChange()"
        class="px-4 py-3 border border-gray-200 rounded-xl text-sm bg-white text-dark-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        <option *ngFor="let investigation of investigations" [value]="investigation">
          {{ investigation }}
        </option>
      </select>
      <select
        [(ngModel)]="selectedType"
        (change)="onTypeChange()"
        class="px-4 py-3 border border-gray-200 rounded-xl text-sm bg-white text-dark-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        <option *ngFor="let type of documentTypes" [value]="type">
          {{ type }}
        </option>
      </select>
      <select
        [(ngModel)]="selectedSort"
        (change)="onSortChange()"
        class="px-4 py-3 border border-gray-200 rounded-xl text-sm bg-white text-dark-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
        <option *ngFor="let sort of sortOptions" [value]="sort">
          {{ sort }}
        </option>
      </select>
      <div class="flex bg-gray-100 rounded-xl p-1">
        <button
          (click)="onViewModeChange('grid')"
          [class]="'px-3 py-2 rounded-lg transition-all duration-200 ' + (viewMode === 'grid' ? 'bg-white text-primary-600 shadow-sm' : 'text-dark-400 hover:text-dark-600')">
          <i class="fas fa-th-large"></i>
        </button>
        <button
          (click)="onViewModeChange('list')"
          [class]="'px-3 py-2 rounded-lg transition-all duration-200 ' + (viewMode === 'list' ? 'bg-white text-primary-600 shadow-sm' : 'text-dark-400 hover:text-dark-600')">
          <i class="fas fa-list"></i>
        </button>
      </div>
    </div>
  </div>
</div>
