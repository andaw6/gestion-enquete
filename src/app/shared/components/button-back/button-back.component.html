<button
  (click)="back()"
  class="flex items-center text-gray-600 hover:text-primary-600 mb-4 group transition-all duration-300 ease-in-out bg-white/50 backdrop-blur-sm px-4 py-2 rounded-lg hover:shadow-md"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-5 w-5 mr-2 transform group-hover:-translate-x-1 transition-all duration-300"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M15 19l-7-7 7-7"
    />
  </svg>
  <span class="font-medium">{{ label }}</span>
</button>
