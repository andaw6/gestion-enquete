<app-entity-loader
  [fetchDataFn]="loadData"
  [headerTitle]="'Détails de l\'Enquête'"
  [loadingTitle]="'Chargement de la enquete...'"
  [loadingSubtitle]="'Récupération des informations d\'un enquête'"
  [errorTitle]="'Impossible de charger l\'enquête'"
  [backButtonText]="'Retour'"
  (goBack)="goBack()"
  (dataLoaded)="onLoaded($event)"
  (loadingState)="onLoadingStateChanged($event)"
  (errorState)="onLoadingError($event)"
>
  <ng-template let-data>
    <ng-container *ngIf="data">
      <div
        class="bg-gradient-to-br from-gray-50 to-gray-100 transition-colors duration-200"
      >
        <!-- Notifications -->
        <app-notification></app-notification>

        <!-- Hero Section -->
        <app-hero-section [reference]="data.reference"></app-hero-section>

        <!-- Main Container -->
        <div class="max-w-7xl mx-auto px-6 py-8">
          <!-- Progress Stepper -->
          <app-progress-stepper></app-progress-stepper>

          <!-- Survey Information Card -->
          <app-suivie></app-suivie>

          <app-progress-section [enquete]="enquete()!"></app-progress-section>

          <!-- Tabs -->
          <app-tabs ></app-tabs>

          <!-- Actions finales -->
          <div
            class="bg-gradient-to-r from-white to-gray-50 rounded-2xl shadow-card border border-gray-200 p-8"
          >
            <h3 class="text-xl font-semibold text-gray-900 mb-6">
              Actions de finalisation
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <button
                (click)="saveDraft()"
                class="flex flex-col items-center justify-center p-6 bg-gradient-to-br from-blue-50 to-blue-100 text-blue-700 rounded-xl hover:from-blue-100 hover:to-blue-200 transition-all shadow-soft hover:shadow-card-hover"
              >
                <svg
                  class="w-8 h-8 mb-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"
                  ></path>
                </svg>
                <span class="font-medium">Enregistrer brouillon</span>
                <span class="text-sm opacity-75 mt-1">Ctrl+S</span>
              </button>
              <button
                (click)="previewReport()"
                class="flex flex-col items-center justify-center p-6 bg-gradient-to-br from-yellow-50 to-yellow-100 text-yellow-700 rounded-xl hover:from-yellow-100 hover:to-yellow-200 transition-all shadow-soft hover:shadow-card-hover"
              >
                <svg
                  class="w-8 h-8 mb-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  ></path>
                </svg>
                <span class="font-medium">Prévisualiser rapport</span>
                <span class="text-sm opacity-75 mt-1">Ctrl+P</span>
              </button>
              <button
                (click)="finalizeInvestigation()"
                class="flex flex-col items-center justify-center p-6 bg-gradient-to-br from-green-50 to-green-100 text-green-700 rounded-xl hover:from-green-100 hover:to-green-200 transition-all shadow-soft hover:shadow-card-hover"
              >
                <svg
                  class="w-8 h-8 mb-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                <span class="font-medium">Finaliser enquête</span>
                <span class="text-sm opacity-75 mt-1">Ctrl+F</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </ng-template>
</app-entity-loader>
