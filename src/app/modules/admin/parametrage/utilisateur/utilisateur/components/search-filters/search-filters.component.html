<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
  <div class="flex flex-col md:flex-row gap-4 items-center">
    <div class="flex-1">
      <div class="relative">
        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        <input
          type="text"
          placeholder="Rechercher par nom, email..."
          [value]="filters.search"
          (input)="onSearchChange($any($event.target).value)"
          class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-200 focus:border-primary">
      </div>
    </div>
    <div class="flex gap-3">
      <div class="relative">
        <select
          [value]="filters.status"
          (change)="onStatusChange($any($event.target).value)"
          class="appearance-none bg-white border border-gray-300 rounded-lg px-4 py-2 pr-8 focus:ring-2 focus:ring-primary-200 focus:border-primary">
          <option value="">Statut</option>
          <option value="Actif">Actif</option>
          <option value="Inactif">Inactif</option>
        </select>
        <i class="fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none"></i>
      </div>
      <div class="relative">
        <select
          [value]="filters.role"
          (change)="onRoleChange($any($event.target).value)"
          class="appearance-none bg-white border border-gray-300 rounded-lg px-4 py-2 pr-8 focus:ring-2 focus:ring-primary-200 focus:border-primary">
          <option value="">Rôle</option>
          <option value="Employé">Employé</option>
          <option value="Enquêteur">Enquêteur</option>
        </select>
        <i class="fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none"></i>
      </div>
      <button
        (click)="onClearFilters()"
        class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition-colors duration-200">
        Effacer les filtres
      </button>
    </div>
  </div>
</div>
