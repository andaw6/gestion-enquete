<div class="block font-sans">
  <div class="bg-white rounded-2xl shadow-lg p-6 transition-all duration-300 ease-in-out border border-gray-300 text-gray-900">
    <h2 class="text-xl font-semibold text-gray-900 mb-6 flex items-center">
      <i class="fas fa-filter mr-2 text-primary-500"></i> {{ title }}
    </h2>

    <div class="custom-dropdown relative">
      <!-- Dropdown header -->
      <div
        class="cursor-pointer border border-gray-300 rounded-xl py-3.5 px-5 flex justify-between items-center bg-white transition-all duration-250 ease-in-out shadow-sm hover:border-emerald-500 hover:shadow-md focus-within:border-emerald-500 focus-within:shadow-lg focus-within:ring-4 focus-within:ring-primary-500/15"
        [class]="isOpen ? 'border-emerald-500 ring-4 ring-primary-500/15' : ''"
        (click)="toggleDropdown($event)">
        <div class="flex items-center">
          <span class="text-gray-700">{{ getSelectedOptionLabel() }}</span>
          <span class="ml-2" [class.hidden]="selectedOptions.length === 0">
            <span class="inline-flex items-center px-3 py-1 bg-gray-100 rounded-full text-xs font-medium text-gray-600">
              {{ selectedOptions.length }} sélectionné{{ selectedOptions.length > 1 ? 's' : '' }}
            </span>
          </span>
        </div>
        <i
          class="fas fa-chevron-down text-primary-500 transition-transform duration-200"
          [style.transform]="isOpen ? 'rotate(180deg)' : ''">
        </i>
      </div>

      <!-- Dropdown menu -->
      <div
        class="absolute top-full left-0 right-0 z-20 bg-white rounded-xl shadow-xl border border-gray-200/50 transition-all duration-300 ease-in-out mt-2 overflow-hidden"
        [class]="isOpen ? 'max-h-96 opacity-100 animate-in fade-in slide-in-from-top-2' : 'max-h-0 opacity-0'">

        <!-- Search input -->
        <div class="p-4 border-b border-gray-100">
          <div class="relative">
            <input
              type="text"
              [(ngModel)]="searchTerm"
              (ngModelChange)="onSearchChange($event)"
              placeholder="Rechercher une option..."
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg text-sm transition-all duration-200 bg-gray-50 text-gray-900 focus:outline-none focus:ring-3 focus:ring-primary-500/20 focus:border-primary-500 focus:bg-white">
            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
          </div>
        </div>

        <!-- Options list -->
        <div class="max-h-56 overflow-y-auto custom-scrollbar py-2 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100 hover:scrollbar-thumb-gray-400">
          <ng-container *ngIf="filteredOptions.length > 0; else noResults">
            <div
              *ngFor="let option of filteredOptions"
              class="px-5 py-3 cursor-pointer transition-all duration-200 mx-2 rounded-lg mb-2 hover:bg-gray-100"
              [class]="isSelected(option.value) ? 'bg-primary-100 font-medium text-primary-600' : ''"
              (click)="selectOption(option)">
              <div class="flex items-center justify-between">
                <div>
                  <div class="font-medium">{{ option.label }}</div>
                  <div class="text-xs text-gray-500 mt-0.5">{{ option.description }}</div>
                </div>
                <i *ngIf="isSelected(option.value)" class="fas fa-check text-primary-600"></i>
              </div>
            </div>
          </ng-container>

          <ng-template #noResults>
            <div class="py-8 px-4 text-center text-gray-500">
              <div class="text-2xl text-gray-300 mb-2">
                <i class="fas fa-search"></i>
              </div>
              <p>Aucun résultat trouvé</p>
              <p class="text-sm text-gray-400 mt-1">Essayez avec un autre terme de recherche</p>
            </div>
          </ng-template>
        </div>

        <!-- Pagination -->
        <div
          class="flex justify-between items-center p-1 border-t border-gray-100 bg-gray-50 rounded-b-xl"
          *ngIf="activePagination">
          <button
            class="flex items-center px-4 py-2 bg-gray-100 text-gray-600 rounded-lg font-medium text-sm border-none transition-all duration-200 hover:bg-gray-200 hover:text-gray-800 focus:outline-none focus:ring-3 focus:ring-primary-500/20 active:transform active:translate-y-0.5 disabled:text-gray-400 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:bg-gray-100"
            [disabled]="pagination.page === 1"
            (click)="prevPage()">
            <i class="fas fa-chevron-left mr-1 text-xs"></i> Précédent
          </button>

          <div class="flex items-center">
            <span class="inline-flex items-center px-3 py-1 bg-gray-100 rounded-full text-xs font-medium text-gray-600">
              <span>{{ pagination.page }}</span>/<span>{{ pagination.totalPage }}</span>
            </span>
          </div>

          <button
            class="flex items-center px-4 py-2 bg-gray-100 text-gray-600 rounded-lg font-medium text-sm border-none transition-all duration-200 hover:bg-gray-200 hover:text-gray-800 focus:outline-none focus:ring-3 focus:ring-primary-500/20 active:transform active:translate-y-0.5 disabled:text-gray-400 disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:bg-gray-100"
            [disabled]="pagination.page >= pagination.totalPage"
            (click)="nextPage()">
            Suivant <i class="fas fa-chevron-right ml-1 text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
