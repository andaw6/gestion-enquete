<nav class="flex" aria-label="Breadcrumb">
  <ol class="flex items-center space-x-2 text-sm">
    <li
      class="flex items-center"
      *ngFor="let item of items; let isLast = last; trackBy: trackByLabel"
    >
      <!-- Cas non dernier -->
      <ng-container *ngIf="!isLast; else lastItem">
        <button
          (click)="onClick(item)"
          class="text-secondary-500 hover:text-primary-600 transition-colors"
        >
          <ng-container *ngIf="item.icon; else textLabel">
            <i [class]="item.icon"></i>
          </ng-container>
          <ng-template #textLabel>
            {{ item.label }}
          </ng-template>
        </button>
        <span class="text-secondary-400 mx-2">/</span>
      </ng-container>

      <!-- Cas dernier -->
      <ng-template #lastItem>
        <span class="text-secondary-900 font-medium">
          {{ item.label }}
        </span>
      </ng-template>
    </li>
  </ol>
</nav>
