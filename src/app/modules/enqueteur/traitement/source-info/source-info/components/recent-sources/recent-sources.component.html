<div class="bg-white rounded-lg shadow border border-gray-200 mb-6">
  <div class="px-6 py-4 border-b border-gray-200">
    <h3 class="text-lg font-medium text-gray-900">Sources Récemment Utilisées</h3>
  </div>
  <div class="p-6">
    <div class="space-y-4">
      <div
        *ngFor="let source of recentSources"
        class="flex items-center justify-between p-4 bg-gray-50 rounded-lg"
      >
        <div class="flex items-center">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center" [ngClass]="source.iconColor">
            <i [class]="source.icon + ' text-white text-sm'"></i>
          </div>
          <div class="ml-4">
            <p class="text-sm font-medium text-gray-900">{{ source.name }}</p>
            <p class="text-xs text-gray-500">{{ source.context }} - {{ source.lastUsed }}</p>
          </div>
        </div>
        <button
          class="px-3 py-1 text-white text-xs rounded transition-colors"
          [ngClass]="getActionButtonClass(source.actionType)"
          (click)="onRecentSourceAction(source.id, source.actionType)"
        >
          {{ getActionText(source.actionType) }}
        </button>
      </div>
    </div>
  </div>
</div>
