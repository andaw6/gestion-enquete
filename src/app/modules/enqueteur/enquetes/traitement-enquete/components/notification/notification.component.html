<div
  *ngFor="let notification of notifications(); trackBy: trackByNotification"
  class="notification fixed top-20 right-4 z-50 max-w-sm transform transition-transform duration-300 ease-in-out"
  [class.translate-x-0]="true"
  [class.translate-x-full]="false"
>
  <div
    class="bg-white rounded-lg shadow-intense border border-gray-200 p-4"
  >
    <div class="flex items-center space-x-3">
      <div class="flex-shrink-0">
        <!-- Success Icon -->
        <svg
          *ngIf="notification.type === 'success'"
          class="w-5 h-5 text-green-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <!-- Error Icon -->
        <svg
          *ngIf="notification.type === 'error'"
          class="w-5 h-5 text-red-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <!-- Info Icon -->
        <svg
          *ngIf="notification.type === 'info'"
          class="w-5 h-5 text-blue-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <!-- Warning Icon -->
        <svg
          *ngIf="notification.type === 'warning'"
          class="w-5 h-5 text-yellow-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          ></path>
        </svg>
      </div>
      <div class="flex-1">
        <p class="font-medium text-gray-900">
          {{ notification.title }}
        </p>
        <p class="text-sm text-gray-500">
          {{ notification.message }}
        </p>
      </div>
      <button
        (click)="remove(notification.id)"
        class="text-gray-400 hover:text-gray-600"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</div>
