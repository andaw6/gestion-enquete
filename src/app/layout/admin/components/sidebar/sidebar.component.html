<aside
  class="sidebar-mobile fixed lg:static inset-y-0 left-0 z-50 w-80 bg-gradient-to-b from-primary via-primary-600 to-primary-800 border-r border-primary-300/30 flex flex-col shadow-xl lg:shadow-none h-full"
  [class.open]="isOpen">

  <!-- User Profile Header - Fixe en haut -->
  <div class="p-4 sm:p-6 border-b border-primary-300/20 flex-shrink-0">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <div
          class="w-16 h-16 bg-gradient-to-br from-secondary to-secondary-600 rounded-full flex items-center justify-center shadow-lg ring-2 ring-white/20">
          <span class="text-white font-bold text-xl">{{ user.initials }}</span>
        </div>
        <div>
          <h2 class="text-xl font-bold text-white">{{ user.name }}</h2>
          <p class="text-sm text-primary-100">{{ user.role }}</p>
        </div>
      </div>
      <!-- Close button for mobile -->
      <button class="lg:hidden text-white/70 hover:text-white p-2 rounded-lg hover:bg-white/10 transition-all duration-200" (click)="onCloseSidebar()">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Navigation - Zone scrollable -->
  <nav class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6">
    <div class="space-y-8">
      <div *ngFor="let section of navigationSections">
        <h3 class="text-xs font-semibold text-primary-100/80 uppercase tracking-wider mb-4">
          {{ section.title }}
        </h3>
        <ul class="space-y-2">
          <li *ngFor="let item of section.items">
            <!-- Menu principal -->
            <div>
              <a
                class="flex items-center cursor-pointer justify-between rounded-lg px-3 py-3 transition-all duration-200 group"
                [class]="item.active ?
                                'text-white bg-white/20 backdrop-blur-sm shadow-lg ring-1 ring-white/30' :
                                'text-primary-100 hover:bg-white/10 hover:text-white'"
                (click)="onNavigationClick(item, $event)">
                <div class="flex items-center space-x-3">
                  <i [class]="item.icon + ' w-5'"
                     [class.text-secondary-300]="item.active"
                     [class.text-primary-200]="!item.active"
                     [class.group-hover:text-secondary-300]="!item.active"></i>
                  <span class="text-sm"
                        [class.font-semibold]="item.active"
                        [class.font-medium]="!item.active">
                                        {{ item.label }}
                                    </span>
                </div>
                <!-- Icône de déroulement pour les menus avec enfants -->
                <i *ngIf="item.children"
                   class="fas fa-chevron-down text-xs text-primary-200 transition-transform duration-200"
                   [class.rotate-180]="item.expanded"
                   [class.text-secondary-300]="item.active"></i>
              </a>

              <!-- Sous-menu -->
              <div *ngIf="item.children" class="submenu-container" [class.expanded]="item.expanded">
                <ul class="mt-2 ml-8 space-y-1 border-l-2 border-primary-300/30 pl-4">
                  <li *ngFor="let child of item.children">
                    <a
                      class="flex items-center cursor-pointer space-x-3 hover:bg-white/10 rounded-lg px-3 py-2 transition-all duration-200 text-sm group"
                      [class]="child.active ?
                                            'text-white bg-white/15 backdrop-blur-sm' :
                                            'text-primary-100 hover:text-white'"
                      (click)="onNavigationClick(child, $event)">
                      <i [class]="child.icon + ' w-4'"
                         [class.text-secondary-300]="child.active"
                         [class.text-primary-200]="!child.active"
                         [class.group-hover:text-secondary-300]="!child.active"></i>
                      <span class="font-medium">{{ child.label }}</span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Logout - Fixe en bas -->
  <div class="p-4 sm:p-6 border-t border-primary-300/20 flex-shrink-0">
    <a href="#"
       class="flex items-center space-x-3 text-red-200 hover:bg-red-500/20 hover:text-red-100 rounded-lg px-3 py-3 transition-all duration-200 group backdrop-blur-sm"
       (click)="onLogout()">
      <i class="fas fa-sign-out-alt w-5 group-hover:text-red-100"></i>
      <span class="text-sm font-medium">Déconnexion</span>
    </a>
  </div>
</aside>
