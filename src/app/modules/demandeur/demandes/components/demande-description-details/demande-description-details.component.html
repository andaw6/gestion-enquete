<div class="bg-card border border-border rounded-xl shadow-professional-lg p-8 animate-slide-up">
      <div class="flex items-center mb-6">
        <div class="w-10 h-10 bg-secondary/10 rounded-lg flex items-center justify-center mr-4">
          <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
          </svg>
        </div>
        <h3 class="text-xl font-heading font-bold text-card-foreground">Description détaillée</h3>
      </div>

      <div class="prose prose-lg max-w-none">
        <p class="text-muted-foreground leading-relaxed mb-6">
          {{ demande.description }}
        </p>

        <h4 class="text-lg font-heading font-bold text-card-foreground mb-4">Points de vérification prioritaires :</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div *ngFor="let point of verificationPoints" class="flex items-start space-x-3 p-4 bg-muted rounded-lg">
            <div class="w-2 h-2 bg-secondary rounded-full mt-2 flex-shrink-0"></div>
            <span class="text-card-foreground font-medium">{{ point }}</span>
          </div>
        </div>
      </div>
    </div>
