<div id="temoignages" class="tab-content">
  <div class="space-y-6">
    <div class="flex justify-between items-center">
      <h3 class="text-lg font-semibold text-gray-900">Liste des témoignages</h3>
      <button
        (click)="openTestimonyModal()"
        class="px-6 py-3 bg-gradient-to-r from-primary-500 to-primary-600 text-white font-medium rounded-lg hover:from-primary-600 hover:to-primary-700 transition-all shadow-soft flex items-center space-x-2"
      >
        <i class="fas fa-plus w-5 h-5"></i>
        <span>Ajouter un témoignage</span>
      </button>
    </div>

    <div class="grid gap-6">
      <!-- Liste dynamique -->
      <ng-container *ngFor="let temoignage of temoignages">
        <div
          class="bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl p-6 border border-gray-200 hover:shadow-card-hover transition-all"
        >
          <!-- Header -->
          <div class="flex justify-between items-start mb-4">
            <div>
              <h4 class="font-semibold text-gray-900 text-lg">
                {{ temoignage.objet }}
              </h4>
              <p class="text-sm text-gray-500">
                Recueilli le
                {{
                  temoignage.dateEnregistrement | date : "dd/MM/yyyy à HH:mm"
                }}
              </p>
            </div>
            <div class="flex space-x-2">
              <button
                (click)="editTemoignage(temoignage)"
                class="p-2 text-gray-500 hover:text-primary-600 rounded-lg hover:bg-white transition-colors"
              >
                <i class="fas fa-edit"></i>
              </button>
              <button
                (click)="deleteTemoignage(temoignage)"
                class="p-2 text-gray-500 hover:text-red-600 rounded-lg hover:bg-white transition-colors"
              >
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>

          <!-- Description -->
          <div class="prose prose-sm max-w-none text-gray-700 mb-4">
            <p>{{ temoignage.description }}</p>
          </div>

          <!-- Footer -->
          <div class="flex items-center justify-between">
            <div class="flex items-center text-sm text-gray-500">
              <i
                class="mr-2"
                [ngClass]="getEtatIconClass(temoignage.etat.code)"
              ></i>
              <span>{{ getLibelle(temoignage.etat.code) }}</span>
            </div>
            <span
              class="px-3 py-1 rounded-full text-xs font-medium"
              [class]="getEtatLibelleClass(temoignage.etat.code)"
            >
              {{ temoignage.etat.libelle }}
            </span>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
