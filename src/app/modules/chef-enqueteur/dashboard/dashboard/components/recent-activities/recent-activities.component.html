    <div class="bg-gradient-to-r from-secondary-500 to-primary-500 px-6 py-5 rounded-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-white/20 rounded-xl backdrop-blur-sm">
          <i class="fas fa-history text-white text-lg"></i>
        </div>
        <h3 class="text-xl font-semibold text-white">Activités Récentes</h3>
      </div>
      <button
        class="group flex items-center space-x-2 px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl transition-all duration-200 backdrop-blur-sm text-sm font-medium"
      >
        <span>Voir tout</span>
        <i
          class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"
        ></i>
      </button>
    </div>
  </div>

  <div class="space-y-4 p-6">
    <div
      *ngFor="let activity of activities"
      class="flex items-start space-x-3 p-3 hover:bg-gray-50 rounded-lg transition-colors cursor-pointer"
    >
      <div
        class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
        [ngClass]="activity.iconBg"
      >
        <i class="text-sm" [ngClass]="[activity.icon, activity.iconColor]"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-900">{{ activity.title }}</p>
        <p class="text-sm text-gray-500">{{ activity.subtitle }}</p>
      </div>
    </div>
  </div>
</div>
