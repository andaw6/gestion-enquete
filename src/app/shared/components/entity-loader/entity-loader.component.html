
<div class="flex items-center justify-center">
  <div *ngIf="loading() && !data()" class="text-center py-12">
    <div class="relative">
      <div class="w-16 h-16 mx-auto mb-4 relative">
        <div
          class="absolute inset-0 border-4 border-primary-200 rounded-full"
        ></div>
        <div
          class="absolute inset-0 border-4 border-primary-500 rounded-full border-t-transparent animate-spin"
        ></div>
      </div>


      <h3 class="text-lg font-semibold text-secondary-700 mb-2">
        Chargement des données...
      </h3>
      <p class="text-sm text-secondary-500">
        Récupération de l'historique des interventions
      </p>


      <div class="w-48 mx-auto mt-4">
        <div class="w-full bg-secondary-200 rounded-full h-1">
          <div
            class="bg-primary-500 h-1 rounded-full animate-pulse"
            style="width: 60%"
          ></div>
        </div>
      </div>
    </div>
  </div>


  <div
    *ngIf="failLoading() && !loading()"
    class="text-center py-12 max-w-md mx-auto"
  >
    <div class="bg-red-50 border border-red-200 rounded-2xl p-8">

      <div
        class="w-16 h-16 mx-auto mb-4 bg-red-100 rounded-full flex items-center justify-center"
      >
        <i class="fas fa-exclamation-triangle text-2xl text-red-500"></i>
      </div>


      <h3 class="text-lg font-semibold text-red-800 mb-2">
        Erreur de chargement
      </h3>


      <p class="text-sm text-red-600 mb-6" [innerHTML]="errorMessage()"></p>


      <div class="space-y-3">

        <button
          (click)="reloadData()"
          [disabled]="isReloading()"
          class="w-full bg-red-500 hover:bg-red-600 disabled:bg-red-300 text-white font-medium py-3 px-6 rounded-lg transition-all duration-200 flex items-center justify-center space-x-2"
        >
          <i
            class="fas"
            [class.fa-redo]="!isReloading()"
            [class.fa-spinner]="isReloading()"
            [class.fa-spin]="isReloading()"
          ></i>
          <span>{{ isReloading() ? "Rechargement..." : "Réessayer" }}</span>
        </button>


        <button
          (click)="goBack.emit()"
          class="w-full bg-secondary-100 hover:bg-secondary-200 text-secondary-700 font-medium py-2 px-6 rounded-lg transition-all duration-200"
        >
          <i class="fas fa-arrow-left mr-2"></i>
          Retour à la liste des véhicules
        </button>
      </div>


      <div
        *ngIf="showTechnicalDetails()"
        class="mt-6 p-4 bg-red-100 rounded-lg border border-red-200"
      >
        <button
          (click)="toggleTechnicalDetails()"
          class="text-xs text-red-600 hover:text-red-800 flex items-center space-x-1"
        >
          <i
            class="fas fa-chevron-down"
            [class.rotate-180]="technicalDetailsExpanded()"
          ></i>
          <span>Détails techniques</span>
        </button>

        <div
          *ngIf="technicalDetailsExpanded()"
          class="mt-3 text-xs text-red-700 font-mono bg-red-50 p-2 rounded border"
        >
          <div><strong>Code d'erreur:</strong> {{ errorCode() }}</div>
          <div><strong>Véhicule ID:</strong> {{ id() }}</div>
          <div>
            <strong>Timestamp:</strong> {{ errorTimestamp() | date : "medium" }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<ng-container *ngIf="data() && !failLoading()">
  <ng-container
    *ngTemplateOutlet="customTemplateRef!; context: { $implicit: data() }"
  ></ng-container>
</ng-container>


<div
  *ngIf="showRetryNotification()"
  class="fixed bottom-4 right-4 bg-yellow-50 border border-yellow-200 rounded-lg p-4 shadow-lg z-50 max-w-sm"
>
  <div class="flex items-start space-x-3">
    <i class="fas fa-exclamation-triangle text-yellow-500 mt-0.5"></i>
    <div class="flex-1">
      <p class="text-sm font-medium text-yellow-800">Échec de la mise à jour</p>
      <p class="text-xs text-yellow-700 mt-1">
        Les données affichées peuvent ne pas être à jour.
      </p>
      <button
        (click)="retryUpdate()"
        class="text-xs text-yellow-600 hover:text-yellow-800 font-medium mt-2"
      >
        Réessayer maintenant
      </button>
    </div>
    <button
      (click)="dismissRetryNotification()"
      class="text-yellow-400 hover:text-yellow-600"
    >
      <i class="fas fa-times text-xs"></i>
    </button>
  </div>
</div>
