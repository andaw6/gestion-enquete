<div
  (click)="sourceSelected.emit(source.id)"
  [class.border-primary]="isSelected"
  [class.bg-primary-50]="isSelected"
  class="border-2 border-dark-200 rounded-lg p-4 cursor-pointer hover:border-primary-300 hover:shadow-md transition-all"
>
  <div class="flex items-start space-x-4">
    <!-- Checkbox de sélection -->
    <div class="pt-1">
      <div
        [class.bg-primary]="isSelected"
        [class.border-primary]="isSelected"
        class="w-5 h-5 rounded border-2 border-dark-300 flex items-center justify-center transition-colors"
      >
        <i *ngIf="isSelected" class="fas fa-check text-white text-xs"></i>
      </div>
    </div>

    <!-- Icône du type -->
    <div
      class="bg-secondary-100 text-secondary w-12 h-12 rounded-lg flex items-center justify-center flex-shrink-0"
    >
      <i [class]="getTypeIcon(source.type.code) + ' text-xl'"></i>
    </div>

    <!-- Informations de la source -->
    <div class="flex-1 min-w-0">
      <div class="flex items-start justify-between mb-2">
        <h4 class="text-base font-semibold text-secondary-800">
          {{ source.nom }}
        </h4>
        <span
          [class]="getEtatClass(source.etat.code)"
          class="text-xs px-2 py-1 rounded-full font-medium ml-2"
        >
          {{ source.etat.libelle }}
        </span>
      </div>

      <p class="text-sm text-dark-600 mb-3">{{ source.description }}</p>

      <div class="flex flex-wrap items-center gap-4 text-xs text-dark-500">
        <div class="flex items-center space-x-1">
          <i class="fas fa-calendar text-primary"></i>
          <span>{{ utilService.formatDate(source.dateObtention) }}</span>
        </div>
        <div class="flex items-center space-x-1">
          <i class="fas fa-star text-yellow-500"></i>
          <span>Fiabilité: {{ source.fiabilite }}/10</span>
        </div>
        <div class="flex items-center space-x-1">
          <i class="fas fa-paperclip text-secondary"></i>
          <span>{{ source.documents.length }} document(s)</span>
        </div>
        <div class="flex items-center space-x-1">
          <i class="fas fa-search text-primary"></i>
          <span>{{ source.enquetes.length }} enquête(s)</span>
        </div>
      </div>
    </div>
  </div>
</div>
