<div class="h-screen flex flex-col overflow-hidden">
    <app-overlay [isActive]="isSidebarOpen" (overlayClick)="closeSidebar()">
    </app-overlay>

    <div class="flex flex-1 overflow-hidden">
        <app-sidebar [navigationSections]="navigation" [isOpen]="isSidebarOpen" (closeSidebar)="closeSidebar()">
        </app-sidebar>

        <!-- Main Content Area - Structure originale -->
        <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
            <!-- Header - Position originale mais fixe -->
            <app-header class="flex-shrink-0 sticky top-0 z-30" (toggleSidebar)="toggleSidebar()">
            </app-header>

            <!-- Content Area avec scroll -->
            <div class="flex-1 overflow-y-auto custom-scrollbar bg-gray-50">
                <main class="p-4 sm:p-6 lg:p-8">
                    <router-outlet></router-outlet>
                </main>
            </div>
        </div>
    </div>
</div>
