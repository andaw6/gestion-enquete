<div class="h-screen flex flex-col overflow-hidden">
  <app-overlay
    [isActive]="isSidebarOpen"
    (overlayClick)="closeSidebar()"
  ></app-overlay>

  <div class="flex flex-1 overflow-hidden">
    <app-sidebar
      [isOpenDesktopMode]="isOpenDesktopMode"
      [navigationSections]="navigation"
      [isOpen]="isSidebarOpen"
      (closeSidebar)="closeSidebar()"
    ></app-sidebar>

    <!-- Main Content Area - Structure originale -->
    <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
      <!-- Projection des headers depuis le parent avec position fixe -->
      <ng-content select="app-header"></ng-content>

      <!-- Content Area avec scroll -->
      <div class="flex-1 overflow-y-auto custom-scrollbar bg-gray-50">
        <main class="p-4 sm:p-6 lg:p-8 bg-gradient-to-br from-gray-50 to-blue-50">
          <router-outlet/>
        </main>
      </div>
    </div>
  </div>
</div>
