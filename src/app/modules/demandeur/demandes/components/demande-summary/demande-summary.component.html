<div
  class="bg-card border border-border rounded-xl shadow-professional-lg p-8 animate-slide-up"
>
  <div class="flex items-center mb-6">
    <div
      class="w-10 h-10 bg-secondary/10 rounded-lg flex items-center justify-center mr-4"
    >
      <svg
        class="w-5 h-5 text-secondary"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
        ></path>
      </svg>
    </div>
    <h3 class="text-xl font-heading font-bold text-card-foreground">
      Résumé exécutif
    </h3>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
    <div class="space-y-6">
      <div>
        <label
          class="block text-sm font-semibold text-muted-foreground uppercase tracking-wide mb-2"
          >Objet de l'enquête</label
        >
        <p class="text-lg font-semibold text-card-foreground leading-relaxed">
          {{ demande.objet }}
        </p>
      </div>
      <div>
        <label
          class="block text-sm font-semibold text-muted-foreground uppercase tracking-wide mb-2"
          >Échéance</label
        >
        <p class="text-card-foreground font-medium">
          {{ formatDate(demande.dateEcheance) }}
        </p>
      </div>
    </div>
    <div class="space-y-6">
      <div>
        <label
          class="block text-sm font-semibold text-muted-foreground uppercase tracking-wide mb-2"
          >Niveau de priorité</label
        >
        <div class="flex items-center space-x-3">
          <div class="flex space-x-1">
            <div
              *ngFor="let i of getPriorityDots()"
              class="w-3 h-3 rounded-full"
              [class.bg-red-500]="i <= demande.priorite"
              [class.bg-border]="i > demande.priorite"
            ></div>
          </div>
          <span class="text-sm font-medium text-muted-foreground"
            >{{ getPrioriteLabel(demande.priorite) }} ({{
              demande.priorite
            }}/5)</span
          >
        </div>
      </div>
      <div>
        <label
          class="block text-sm font-semibold text-muted-foreground uppercase tracking-wide mb-2"
          >Demandeur</label
        >
        <p class="text-card-foreground font-medium">
          {{ demande.utilisateur?.username || "Non assigné" }}
        </p>
      </div>
    </div>
  </div>
</div>
