      <!-- Stats Cards avec animations -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 animate-fade-in">
            <!-- En attente -->
            <div class="stat-card hover-lift bg-white rounded-2xl shadow-card border border-yellow-100 p-6 cursor-pointer group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-50 rounded-full -mr-16 -mt-16 opacity-20"></div>
                <div class="relative">
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-4 bg-gradient-to-br from-yellow-50 to-yellow-100 rounded-2xl shadow-sm group-hover:shadow-md transition-shadow">
                            <i data-lucide="clock" class="w-7 h-7 text-yellow-600"></i>
                        </div>
                        <span class="px-3 py-1.5 bg-yellow-50 text-yellow-700 text-xs font-bold rounded-full border border-yellow-200 shadow-sm">PENDING</span>
                    </div>
                    <p class="text-sm font-semibold text-dark-600 mb-2">En attente</p>
                    <p class="text-3xl font-bold text-secondary-900 mb-1">{{stats.pending}}</p>
                    <div class="flex items-center gap-2 text-xs text-dark-500">
                        <i data-lucide="trending-up" class="w-3 h-3 text-yellow-600"></i>
                        <span class="font-medium">+2 aujourd'hui</span>
                    </div>
                </div>
            </div>

            <!-- Approuvées -->
            <div class="stat-card hover-lift bg-white rounded-2xl shadow-card border border-green-100 p-6 cursor-pointer group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-green-50 rounded-full -mr-16 -mt-16 opacity-20"></div>
                <div class="relative">
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-4 bg-gradient-to-br from-green-50 to-green-100 rounded-2xl shadow-sm group-hover:shadow-md transition-shadow">
                            <i data-lucide="check-circle-2" class="w-7 h-7 text-green-600"></i>
                        </div>
                        <span class="px-3 py-1.5 bg-green-50 text-green-700 text-xs font-bold rounded-full border border-green-200 shadow-sm">APPROVED</span>
                    </div>
                    <p class="text-sm font-semibold text-dark-600 mb-2">Approuvées</p>
                    <p class="text-3xl font-bold text-secondary-900 mb-1">{{stats.approved}}</p>
                    <div class="flex items-center gap-2 text-xs text-dark-500">
                        <i data-lucide="calendar" class="w-3 h-3 text-green-600"></i>
                        <span class="font-medium">+5 cette semaine</span>
                    </div>
                </div>
            </div>

            <!-- Rejetées -->
            <div class="stat-card hover-lift bg-white rounded-2xl shadow-card border border-red-100 p-6 cursor-pointer group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-red-50 rounded-full -mr-16 -mt-16 opacity-20"></div>
                <div class="relative">
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-4 bg-gradient-to-br from-red-50 to-red-100 rounded-2xl shadow-sm group-hover:shadow-md transition-shadow">
                            <i data-lucide="x-circle" class="w-7 h-7 text-red-600"></i>
                        </div>
                        <span class="px-3 py-1.5 bg-red-50 text-red-700 text-xs font-bold rounded-full border border-red-200 shadow-sm">REJECTED</span>
                    </div>
                    <p class="text-sm font-semibold text-dark-600 mb-2">Rejetées</p>
                    <p class="text-3xl font-bold text-secondary-900 mb-1">{{stats.rejected}}</p>
                    <div class="flex items-center gap-2 text-xs text-dark-500">
                        <i data-lucide="percent" class="w-3 h-3 text-red-600"></i>
                        <span class="font-medium">Taux: 10%</span>
                    </div>
                </div>
            </div>

            <!-- Total -->
            <div class="stat-card hover-lift bg-gradient-to-br from-primary-500 to-primary-600 rounded-2xl shadow-intense p-6 cursor-pointer group text-white border border-primary-300">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white rounded-full -mr-16 -mt-16 opacity-10"></div>
                <div class="relative">
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-4 bg-white/20 backdrop-blur-sm rounded-2xl shadow-sm group-hover:bg-white/30 transition-all">
                            <i data-lucide="activity" class="w-7 h-7 text-white"></i>
                        </div>
                        <span class="px-3 py-1.5 bg-white/20 backdrop-blur-sm text-white text-xs font-bold rounded-full border border-white/30 shadow-sm">TOTAL</span>
                    </div>
                    <p class="text-sm font-semibold text-primary-50 mb-2">Total des demandes</p>
                    <p class="text-3xl font-bold mb-1">{{stats.total}}</p>
                    <div class="flex items-center gap-2 text-xs text-primary-100">
                        <i data-lucide="bar-chart-3" class="w-3 h-3"></i>
                        <span class="font-medium">+7 ce mois</span>
                    </div>
                </div>
            </div>
        </div>
