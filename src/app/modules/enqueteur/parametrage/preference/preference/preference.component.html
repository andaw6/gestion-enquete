<div class="space-y-6">
  <!-- Apparence -->
  <div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-medium text-gray-900">Apparence</h3>
      <p class="text-sm text-gray-500">Personnalisez l'apparence de l'interface</p>
    </div>
    <div class="p-6">
      <form [formGroup]="preferencesForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Thème</label>
          <select
            formControlName="theme"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-primary-500 focus:border-primary-500">
            <option value="auto">Automatique (système)</option>
            <option value="light">Clair</option>
            <option value="dark">Sombre</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Langue</label>
          <select
            formControlName="language"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-primary-500 focus:border-primary-500">
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="wo">Wolof</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Fuseau horaire</label>
          <select
            formControlName="timezone"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-primary-500 focus:border-primary-500">
            <option value="GMT+0">GMT+0 (Dakar)</option>
            <option value="GMT+1">GMT+1 (Paris)</option>
            <option value="GMT-5">GMT-5 (New York)</option>
          </select>
        </div>
      </form>
    </div>
  </div>

  <!-- Format et affichage -->
  <div class="bg-white rounded-lg shadow border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-medium text-gray-900">Format et affichage</h3>
      <p class="text-sm text-gray-500">Configurez les formats d'affichage</p>
    </div>
    <div class="p-6">
      <!-- Formulaire connecté au même formGroup -->
      <form [formGroup]="preferencesForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Format de date</label>
          <select
            formControlName="dateFormat"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-primary-500 focus:border-primary-500">
            <option value="DD/MM/YYYY">DD/MM/YYYY (21/01/2024)</option>
            <option value="MM/DD/YYYY">MM/DD/YYYY (01/21/2024)</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD (2024-01-21)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Format d'heure</label>
          <select
            formControlName="timeFormat"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-primary-500 focus:border-primary-500">
            <option value="24">24 heures (14:30)</option>
            <option value="12">12 heures (2:30 PM)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Éléments par page</label>
          <select
            formControlName="itemsPerPage"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-primary-500 focus:border-primary-500">
            <option [value]="10">10</option>
            <option [value]="25">25</option>
            <option [value]="50">50</option>
            <option [value]="100">100</option>
          </select>
        </div>

        <!-- Messages de succès/erreur -->
        <div *ngIf="successMessage()" class="p-4 bg-green-50 border border-green-200 rounded-md">
          <div class="flex">
            <i class="fas fa-check-circle text-green-400 mr-2 mt-0.5"></i>
            <p class="text-sm text-green-800">{{ successMessage() }}</p>
          </div>
        </div>

        <div *ngIf="errorMessage()" class="p-4 bg-red-50 border border-red-200 rounded-md">
          <div class="flex">
            <i class="fas fa-exclamation-circle text-red-400 mr-2 mt-0.5"></i>
            <p class="text-sm text-red-800">{{ errorMessage() }}</p>
          </div>
        </div>

        <!-- Bouton d'enregistrement -->
        <div class="flex justify-end">
          <button
            type="submit"
            [disabled]="preferencesForm.invalid || isSubmitting()"
            class="px-6 py-2 bg-primary-500 text-white rounded-md hover:bg-primary-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <span *ngIf="isSubmitting()" class="inline-flex items-center">
              <i class="fas fa-spinner fa-spin mr-2"></i>
              Enregistrement...
            </span>
            <span *ngIf="!isSubmitting()">Enregistrer les préférences</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
