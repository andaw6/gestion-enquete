<div
  class="bg-card border border-border rounded-xl shadow-professional p-6 animate-slide-up"
>
  <h3
    class="text-lg font-heading font-bold text-card-foreground mb-4 flex items-center"
  >
    <svg
      class="w-5 h-5 mr-2 text-secondary"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
      ></path>
    </svg>
    Entreprise concernée
  </h3>
  <div class="space-y-4">
    <div>
      <label
        class="block text-xs font-semibold text-muted-foreground uppercase tracking-wide mb-1"
        >Raison sociale</label
      >
      <p class="text-card-foreground font-semibold">Entreprise ABC</p>
    </div>
    <div>
      <label
        class="block text-xs font-semibold text-muted-foreground uppercase tracking-wide mb-1"
        >Numéro SIRET</label
      >
      <p class="text-card-foreground">{{ concerne.numero }}</p>
    </div>
    <div>
      <label
        class="block text-xs font-semibold text-muted-foreground uppercase tracking-wide mb-1"
        >Téléphone</label
      >
      <p class="text-card-foreground">{{ concerne.telephone }}</p>
    </div>
    <div>
      <label
        class="block text-xs font-semibold text-muted-foreground uppercase tracking-wide mb-1"
        >Région</label
      >
      <span
        class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-secondary/10 text-secondary"
      >
        {{ concerne.regionSocial }}
      </span>
    </div>
  </div>
</div>
