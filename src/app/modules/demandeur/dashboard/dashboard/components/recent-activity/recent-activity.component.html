<div
  class="bg-white/70 backdrop-blur-sm rounded-2xl p-6 shadow-lg border border-white/20 animate-fade-in h-full"
>
  <h2 class="text-xl font-bold text-gray-900 mb-6">Activité récente</h2>
  <div class="space-y-4">
    <div *ngFor="let activity of activities" class="flex items-start space-x-3">
      <div [ngClass]="getActivityIconClass(activity.type)">
        <i
          [ngClass]="
            activity.icon +
            ' ' +
            getActivityIconColor(activity.type) +
            ' text-xs'
          "
        ></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-900">{{ activity.title }}</p>
        <p class="text-xs text-gray-500">{{ activity.time }}</p>
      </div>
    </div>
  </div>
</div>
