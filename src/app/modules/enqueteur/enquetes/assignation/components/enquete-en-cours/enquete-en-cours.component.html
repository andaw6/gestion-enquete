<div
  class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-card border border-gray-200/50 animate-zoom-in"
>
  <div
    class="px-8 py-6 border-b border-gray-200/50 bg-gradient-to-r from-blue-50/50 to-purple-50/50 rounded-t-2xl"
  >
    <h3 class="text-xl font-bold text-gray-900 flex items-center">
      <div
        class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center mr-3"
      >
        <i class="fas fa-tasks text-white text-sm"></i>
      </div>
      Mes Enquêtes En Cours
    </h3>
  </div>
  <div class="p-8">
    <div class="space-y-6">
      <div
        *ngFor="let enquete of enquetes"
        class="rounded-2xl p-6 border-2 card-hover"
        [ngClass]="getBgColor(enquete.demande!.concerne.type)"
      >
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <div
              class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-card"
              [ngClass]="getGradient(enquete.demande!.concerne.type)"
            >
              <i
                class="text-white text-lg"
                [ngClass]="getIcon(enquete.demande!.concerne.type)"
              ></i>
            </div>
            <div class="ml-5">
              <p class="text-lg font-bold text-gray-900">{{ getTitle(enquete.demande!.concerne) }}</p>
              <p class="text-sm text-gray-600 mt-1">
                Acceptée le {{ enquete.dateAssignation }} • Échéance:
                {{ enquete.demande!.dateEcheance }}
              </p>
              <div class="mt-3">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-sm font-semibold text-gray-700"
                    >Progression</span
                  >
                  <span
                    class="text-sm font-bold"
                    [ngClass]="getProgressColor(enquete.progression)"
                    >{{ enquete.progression }}%</span
                  >
                </div>
                <div class="w-40 bg-gray-200 rounded-full h-3">
                  <div
                    class="h-3 rounded-full shadow-sm"
                    [ngClass]="
                      getProgressColor(enquete.progression).replace(
                        'text-',
                        'bg-'
                      )
                    "
                    [style.width.%]="enquete.progression"
                  ></div>
                </div>
              </div>
            </div>
          </div>
          <div class="flex space-x-3">
            <button
              class="px-5 py-2 text-white font-semibold rounded-xl transition-all duration-200 shadow-card card-hover"
              [ngClass]="getActionButtonClass(enquete.progression)"
              (click)="handleSurveyAction(enquete.id, enquete.progression)"
            >
              {{ getActionButtonText(enquete.progression) }}
            </button>
            <button
              class="px-5 py-2 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition-all duration-200 card-hover"
              (click)="voirEnquete(enquete)"
            >
              Voir
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
