<div *ngIf="isOpen"
     class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto custom-scrollbar h-full w-full z-50"
     (click)="onBackdropClick($event)">
  <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
    <div class="mt-3">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-medium text-gray-900">Nouvel Événement</h3>
        <button (click)="onClose()"
                class="text-gray-400 hover:text-gray-600">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Titre</label>
          <input
            type="text"
            formControlName="title"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
            placeholder="Titre de l'événement">
          <div *ngIf="eventForm.get('title')?.invalid && eventForm.get('title')?.touched"
               class="text-red-500 text-xs mt-1">
            Le titre est requis
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
          <select
            formControlName="type"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500">
            <option value="enquete">Enquête terrain</option>
            <option value="rdv">Rendez-vous</option>
            <option value="echeance">Échéance</option>
            <option value="reunion">Réunion</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
            <input
              type="date"
              formControlName="date"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500">
            <div *ngIf="eventForm.get('date')?.invalid && eventForm.get('date')?.touched"
                 class="text-red-500 text-xs mt-1">
              La date est requise
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Heure</label>
            <input
              type="time"
              formControlName="time"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500">
            <div *ngIf="eventForm.get('time')?.invalid && eventForm.get('time')?.touched"
                 class="text-red-500 text-xs mt-1">
              L'heure est requise
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Durée (minutes)</label>
          <input
            type="number"
            formControlName="duration"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Priorité</label>
          <select
            formControlName="priority"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500">
            <option value="normale">Normale</option>
            <option value="haute">Haute</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea
            formControlName="description"
            rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500"
            placeholder="Description de l'événement">
              </textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
          <button
            type="button"
            (click)="onClose()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-500">
            Annuler
          </button>
          <button
            type="submit"
            [disabled]="eventForm.invalid || isSubmitting()"
            class="px-4 py-2 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500">
            {{ isSubmitting() ? 'Création...' : 'Créer' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
