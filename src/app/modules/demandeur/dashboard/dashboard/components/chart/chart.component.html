<div
  class="bg-white/70 backdrop-blur-sm rounded-2xl p-6 shadow-lg border border-white/20 animate-fade-in"
>
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-gray-900">Évolution des demandes</h2>
    <div class="flex items-center space-x-2">
      <!-- Date de début -->
      <input
        type="date"
        [(ngModel)]="startDate"
        [value]="startDate"
        class="px-3 py-1 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-400"
      />

      <!-- Bouton d'application -->
      <button
        (click)="applyDateRange()"
        class="px-3 py-1 bg-primary-600 text-white text-sm rounded-lg hover:bg-primary-700"
      >
        Appliquer
      </button>
      <button
        (click)="resetDateRange()"
        class="px-3 py-1 text-gray-700 text-sm rounded-lg hover:bg-gray-200 flex items-center gap-2"
      >
        <i class="fas fa-rotate-right"></i>
        <!-- Reset -->
      </button>
    </div>
  </div>
  <div class="relative h-80 w-full">
    <canvas #chartCanvas></canvas>
  </div>
</div>
