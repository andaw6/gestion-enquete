<div class="bg-white rounded-lg shadow border border-gray-200 p-4 mb-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-2">
      <div class="relative">
        <input
          type="text"
          placeholder="Rechercher une source..."
          class="pl-10 pr-4 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900 w-80"
          [formControl]="searchControl"
        >
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fas fa-search text-gray-400"></i>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <select
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900"
        [(ngModel)]="filter.typeCode"
        (ngModelChange)="onFilterChange()"
      >
        <option value="">Toutes les catégories</option>
        <option *ngFor="let type of typeSources" [value]="type.code">{{type.libelle}}</option>
      </select>

      <select
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900"
        [(ngModel)]="filter.etatCode"
        (ngModelChange)="onFilterChange()"
      >
        <option value="">Toutes les catégories</option>
        <option *ngFor="let etat of etatSources" [value]="etat.code">{{etat.libelle}}</option>
      </select>

      <select
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900"
        [(ngModel)]="filter.niveauFiabilite"
        (ngModelChange)="onFilterChange()"
      >
        <option value="">Tous niveaux de fiabilité</option>
        <option *ngFor="let opt of reliabilityLevels" [value]="opt.value">{{opt.label}}</option>
      </select>

      <select
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900"
        [(ngModel)]="filter.sortBy"
        (ngModelChange)="onFilterChange()"
      >
        <option *ngFor="let opt of sourceInfoTrie" [value]="opt.value">{{ opt.label }}</option>
      </select>
    </div>
  </div>
</div>
