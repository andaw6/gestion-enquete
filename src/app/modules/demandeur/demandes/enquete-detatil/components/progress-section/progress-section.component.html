<div class="card-gradient rounded-xl shadow-soft border border-gray-100 p-8 mb-8 animate-slide-up" style="animation-delay: 0.4s;">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h3 class="text-2xl font-bold text-secondary-900">Progression de l'enquête</h3>
          <p class="text-secondary-600 mt-1">{{ getCurrentStepDescription() }}</p>
        </div>
        <div class="text-right">
          <span class="text-3xl font-bold text-primary-600">{{ enquete.progression || 0 }}%</span>
          <p class="text-sm text-gray-500">Complétée</p>
        </div>
      </div>
      <div class="relative">
        <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
          <div
            class="bg-gradient-to-r from-primary-400 to-primary-600 h-4 rounded-full transition-all duration-1000 shadow-glow relative"
            [style.width.%]="enquete.progression || 0">
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent animate-pulse"></div>
          </div>
        </div>
        <div class="flex justify-between text-xs text-gray-500 mt-2">
          <span>Début</span>
          <span>Collecte</span>
          <span>Analyse</span>
          <span>Rapport</span>
          <span>Finalisation</span>
        </div>
      </div>
    </div>
