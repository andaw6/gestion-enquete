<div class="bg-white overflow-hidden shadow-sm rounded-lg border border-gray-200">
  <div class="p-6">
    <div class="flex items-center">
      <div class="flex-shrink-0">
        <div [class]="'w-12 h-12 rounded-lg flex items-center justify-center ' + getBackgroundColor()">
          <i [class]="stat.icon + ' text-xl ' + stat.iconColor"></i>
        </div>
      </div>
      <div class="ml-4 w-0 flex-1">
        <dl>
          <dt class="text-sm font-medium text-gray-500 truncate">{{ stat.title }}</dt>
          <dd class="flex items-baseline">
            <div class="text-2xl font-semibold text-gray-900">{{ stat.value }}</div>
            <div [class]="'ml-2 flex items-baseline text-sm font-semibold ' + getChangeColor()">
              <i [class]="getChangeIcon()"></i>
              <span class="sr-only">{{ getChangeText() }}</span>
              {{ Math.abs(stat.change) }}%
            </div>
          </dd>
        </dl>
      </div>
    </div>
  </div>
</div>
