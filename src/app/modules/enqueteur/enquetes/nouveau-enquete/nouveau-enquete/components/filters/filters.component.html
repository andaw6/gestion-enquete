<div class="bg-white rounded-lg shadow border border-gray-200 p-4 mb-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-2">
      <div class="relative">
        <input
          type="text"
          placeholder="Rechercher..."
          [(ngModel)]="filters.searchTerm"
          (input)="onFilterChange()"
          class="pl-10 pr-4 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900 w-64"
        >
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="fas fa-search text-gray-400"></i>
        </div>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <select
        [(ngModel)]="filters.priorite"
        (change)="onFilterChange()"
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900"
      >
        <option *ngFor="let option of prioriteOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      <select
        [(ngModel)]="filters.typeConcerne"
        (change)="onFilterChange()"
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900"
      >
        <option *ngFor="let option of typeOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      <select
        [(ngModel)]="filters.sortBy"
        (change)="onFilterChange()"
        class="px-3 py-2 border border-gray-300 rounded-md text-sm bg-white text-gray-900"
      >
        <option *ngFor="let option of sortOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>
  </div>
</div>
