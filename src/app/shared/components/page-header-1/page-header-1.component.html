<div class="animate-fade-in-up">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div class="flex items-center gap-4">
      <button
        *ngIf="config.backButtonLeft"
        (click)="config.backButtonLeft.action()"
        class="p-2 text-secondary-600 hover:text-secondary-900 hover:bg-secondary-100 rounded-lg transition-colors duration-200 {{ config.backButtonLeft.cssClass || '' }}"
      >
        <i class="{{ config.backButtonLeft.icon || 'fas fa-arrow-left' }} text-xl"></i>
      </button>

      <div>
        <h1 class="text-3xl font-bold text-secondary-900 mb-2">{{ config.title }}</h1>
        <p *ngIf="config.subtitle" class="text-secondary-600">{{ config.subtitle }}</p>
      </div>
    </div>

    <div *ngIf="config.buttons?.length" class="mt-4 sm:mt-0 flex space-x-3">
      <button
        *ngFor="let btn of config.buttons"
        type="button"
        [ngClass]="getButtonClasses(btn)"
        (click)="btn.action()"
      >
        <i *ngIf="btn.icon" class="{{ btn.icon }} mr-2"></i>
        {{ btn.label }}
      </button>
    </div>
  </div>
</div>
