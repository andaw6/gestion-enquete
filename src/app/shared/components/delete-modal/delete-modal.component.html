<div id="deleteModalOverlay" *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-50" (click)="onClickOutside($event)">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-xl shadow-feature-card max-w-md w-full p-6 animate-fade-in-up">
      <div class="flex items-center mb-4">
        <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mr-4">
          <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.728-.833-2.498 0L4.316 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-semibold text-secondary-900">{{info.title}}</h3>
          <p class="text-sm text-secondary-600">{{info.subtitle}}</p>
        </div>
      </div>
      <p class="text-secondary-700 mb-6">
        {{info.message}}
      </p>
      <div class="flex space-x-3">
        <button (click)="onConfirm()" class="flex-1 bg-red-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-700 transition-colors duration-200">
          Supprimer
        </button>
        <button (click)="onCancel()" class="flex-1 bg-secondary-100 text-secondary-700 px-4 py-2 rounded-lg font-medium hover:bg-secondary-200 transition-colors duration-200">
          Annuler
        </button>
      </div>
    </div>
  </div>
</div>
