<div
  class="bg-gradient-to-r from-secondary to-secondary-700 px-6 py-4 flex items-center justify-between"
>
  <div class="flex items-center space-x-3">
    <div class="bg-white/20 p-2 rounded-lg">
      <i [class]="iconClass + ' text-white text-xl'"></i>
    </div>
    <div>
      <h2 class="text-xl font-bold text-white">{{ title }}</h2>
      <p class="text-secondary-100 text-sm">{{ subtitle }}</p>
    </div>
  </div>
  <button
    (click)="close.emit()"
    type="button"
    class="text-white/80 hover:text-white hover:bg-white/10 p-2 rounded-lg transition-colors"
  >
    <i class="fas fa-times w-6 h-6"></i>
  </button>
</div>
