<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-dark-900/60 backdrop-blur-sm overflow-y-auto h-full w-full z-50 animate-fade-in"
>
  <div
    class="relative top-8 mx-auto p-0 border-0 w-11/12 md:w-3/4 lg:w-1/2 xl:w-2/5 max-w-2xl shadow-intense rounded-2xl bg-white animate-slide-up"
  >
    <!-- Header avec dégradé -->
    <div
      class="bg-gradient-to-r from-primary-500 to-secondary-500 p-6 rounded-t-2xl"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-white/20 rounded-lg backdrop-blur-sm">
            <i class="fas fa-user-plus text-white text-lg"></i>
          </div>
          <h3 class="text-xl font-semibold text-white">Assigner l'Enquête</h3>
        </div>
        <button
          (click)="onClose()"
          class="p-2 text-white/80 hover:text-white hover:bg-white/20 rounded-lg transition-all duration-200"
        >
          <i class="fas fa-times text-lg"></i>
        </button>
      </div>
    </div>

    <!-- Contenu principal -->
    <div class="p-6 space-y-6">
      <!-- Détails de l'Enquête avec design card moderne -->
      <div
        *ngIf="enquete"
        class="bg-gradient-to-br from-gray-50 to-gray-100 p-5 rounded-xl border border-gray-200 shadow-soft"
      >
        <div class="flex items-center space-x-2 mb-4">
          <div class="p-1.5 bg-primary-100 rounded-lg">
            <i class="fas fa-search text-primary-600 text-sm"></i>
          </div>
          <h4 class="font-semibold text-dark-800">Détails de l'Enquête</h4>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-3">
            <div class="flex items-start space-x-2">
              <span
                class="text-xs font-medium text-gray-500 uppercase tracking-wide min-w-fit"
                >ID:</span
              >
              <span
                class="font-mono text-sm bg-white px-2 py-1 rounded border text-dark-700"
                >{{ enquete.reference }}</span
              >
            </div>
            <div class="flex items-start space-x-2">
              <span
                class="text-xs font-medium text-gray-500 uppercase tracking-wide min-w-fit"
                >Description:</span
              >
              <span class="text-sm text-dark-700 leading-relaxed">{{
                enquete.objet
              }}</span>
            </div>
          </div>
          <div class="flex items-center justify-end">
            <div class="text-center">
              <span
                class="text-xs font-medium text-gray-500 uppercase tracking-wide block mb-2"
                >Priorité</span
              >
              <span
                [class]="
                  'inline-flex items-center px-3 py-2 rounded-full text-sm font-medium shadow-sm ' +
                  getPrioriteClass(enquete.priorite)
                "
              >
                <span
                  class="w-2 h-2 rounded-full bg-current mr-2 animate-pulse"
                ></span>
                {{ getPrioriteLabel(enquete.priorite) }}
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulaire d'assignation -->
      <div class="space-y-5">
        <!-- Sélection Enquêteur avec design amélioré -->
        <div class="group">
          <label
            class="flex items-center space-x-2 text-sm font-semibold text-dark-700 mb-3"
          >
            <i class="fas fa-user-tie text-secondary-500"></i>
            <span>Sélectionner un Enquêteur</span>
          </label>
          <div class="relative">
            <select
              [(ngModel)]="assignmentData.enqueteurId"
              class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200 appearance-none cursor-pointer hover:border-primary-300"
            >
              <option value="0">Choisir un enquêteur...</option>
              <option
                *ngFor="let enqueteur of enqueteurs"
                [value]="enqueteur.id"
              >
                {{ enqueteur.prenom }} {{ enqueteur.nom }} -
                {{ enqueteur.specialite }} ({{ getEnqueteurStatus(enqueteur) }})
              </option>
            </select>
            <div
              class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none"
            >
              <i class="fas fa-chevron-down text-gray-400 text-sm"></i>
            </div>
          </div>
        </div>

        <!-- Date Limite avec icône -->
        <div class="group">
          <label
            class="flex items-center space-x-2 text-sm font-semibold text-dark-700 mb-3"
          >
            <i class="fas fa-calendar-alt text-secondary-500"></i>
            <span>Date Limite Souhaitée</span>
          </label>
          <div class="relative">
            <input
              type="date"
              [(ngModel)]="assignmentData.dateLimite"
              class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200"
            />
          </div>
        </div>

        <!-- Instructions avec design textarea moderne -->
        <div class="group">
          <label
            class="flex items-center space-x-2 text-sm font-semibold text-dark-700 mb-3"
          >
            <i class="fas fa-clipboard-list text-secondary-500"></i>
            <span>Instructions Spéciales</span>
          </label>
          <div class="relative">
            <textarea
              [(ngModel)]="assignmentData.instructions"
              rows="4"
              class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200 resize-none"
              placeholder="Instructions particulières pour cette enquête..."
            ></textarea>
            <div class="absolute bottom-3 right-3 text-xs text-gray-400">
              <i class="fas fa-edit"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Boutons d'action avec design moderne -->
      <div class="flex justify-end space-x-4 pt-4 border-t border-gray-100">
        <button
          (click)="onClose()"
          class="px-6 py-3 bg-gray-100 text-dark-600 rounded-xl hover:bg-gray-200 transition-all duration-200 font-medium flex items-center space-x-2 shadow-sm hover:shadow-card"
        >
          <i class="fas fa-times text-sm"></i>
          <span>Annuler</span>
        </button>
        <button
          (click)="onAssign()"
          class="px-6 py-3 bg-gradient-to-r from-primary-500 to-primary-600 text-white rounded-xl hover:from-primary-600 hover:to-primary-700 transition-all duration-200 font-medium flex items-center space-x-2 shadow-card hover:shadow-card-hover transform hover:-translate-y-0.5"
        >
          <i class="fas fa-user-plus"></i>
          <span>Assigner</span>
        </button>
      </div>
    </div>
  </div>
</div>
