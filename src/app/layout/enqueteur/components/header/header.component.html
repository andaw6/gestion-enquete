<header class="bg-white border-b border-gray-200 px-4 sm:px-6 lg:px-8 py-4 shadow-sm">
    <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button class="lg:hidden text-gray-600 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100"
                (click)="onToggleSidebar()">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-3">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-primary-600 to-primary-700 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-sm">A</span>
                </div>
                <div>
                    <span class="font-bold text-gray-900 text-lg">AfriLins</span>
                    <p class="text-xs text-gray-500 hidden sm:block">Solutions Techniques et Conseils</p>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="hidden md:flex items-center space-x-3">
<!--                <button class="text-gray-600 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100 relative"-->
<!--                    (click)="onNotificationClick()">-->
<!--                    <i class="fas fa-bell"></i>-->
<!--                    <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>-->
<!--                </button>-->
<!--                <button class="text-gray-600 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100"-->
<!--                    (click)="onMessageClick()">-->
<!--                    <i class="fas fa-envelope"></i>-->
<!--                </button>-->
                <button class="text-gray-600 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100"
                    (click)="onSearchClick()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="flex items-center space-x-3 bg-gray-50 rounded-lg px-3 py-2 border cursor-pointer"
                (click)="onProfileClick()">
                <div
                    class="w-8 h-8 bg-gradient-to-br from-primary-600 to-primary-700 rounded-full flex items-center justify-center">
                    <span class="text-white font-bold text-xs">{{ user.initials }}</span>
                </div>
                <span class="text-sm font-medium text-gray-900 hidden sm:block">{{ user.name }}</span>
                <i class="fas fa-chevron-down text-xs text-gray-500"></i>
            </div>
        </div>
    </div>
</header>
