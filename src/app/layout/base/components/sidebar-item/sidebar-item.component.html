<!-- Lien principal -->
<a
  class="flex items-center cursor-pointer justify-between rounded-lg px-3 py-3 transition-all duration-200 group"
  [class]="item.active ?
                'text-white bg-white/20 backdrop-blur-sm shadow-lg ring-1 ring-white/30' :
                'text-primary-100 hover:bg-white/10 hover:text-white'"
  (click)="handleClick($event)">
  <div class="flex items-center space-x-3">
    <i [class]="item.icon + ' w-5 text-white'"
       [class.text-secondary-300]="item.active"
       [class.text-primary-200]="!item.active"
       [class.group-hover:text-secondary-300]="!item.active"></i>
    <span class="text-sm text-white"
          [class.font-semibold]="item.active"
          [class.font-medium]="!item.active">
      {{ item.label }}
    </span>
  </div>
  <i *ngIf="item.children"
     class="fas fa-chevron-down text-xs text-primary-200 transition-transform duration-200"
     [class.rotate-180]="item.expanded"
     [class.text-secondary-300]="item.active"></i>
</a>

<!-- Sous-menu récursif -->
<div *ngIf="item.children && item.expanded" class="submenu-container">
  <ul class="mt-2 ml-8 space-y-1 border-l-2 border-primary-300/30 pl-4">
    <li *ngFor="let child of item.children">
      <app-sidebar-item [item]="child"></app-sidebar-item>
    </li>
  </ul>
</div>
