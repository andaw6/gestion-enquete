<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  (click)="onBackdropClick($event)"
>
  <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4" (click)="$event.stopPropagation()">
    <div class="px-6 py-4 border-b border-gray-200">
      <h3 class="text-lg font-medium text-gray-900">Télécharger des Documents</h3>
    </div>

    <div class="p-6">
      <div class="space-y-4">
        <!-- Nom du document -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nom du document</label>
          <input
            type="text"
            [(ngModel)]="documentName"
            placeholder="Saisissez le nom du document"
            class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
        </div>

        <!-- Description du document -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Description (optionnelle)</label>
          <textarea
            [(ngModel)]="documentDescription"
            placeholder="Décrivez brièvement ce document..."
            rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
          ></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Associer à une enquête</label>
          <select
            [(ngModel)]="selectedInvestigation"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white text-gray-900"
          >
            <option value="unclassified">Documents non classés</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Type de document</label>
          <select
            [(ngModel)]="selectedDocumentType"
            class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white text-gray-900"
          >
            <option value="" [disabled]="true">Séléctionnée le type de document</option>
            <option *ngFor="let type of typeDocument$| async" [value]="type.id">{{ type.libelle }}</option>
          </select>
        </div>

        <div
          class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors">
          <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4"></i>
          <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">
            Glissez-déposez votre fichier ici ou
            <button
              type="button"
              (click)="fileInput.click()"
              class="text-blue-500 hover:text-blue-600 font-medium"
            >
              parcourez
            </button>
          </p>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            Formats acceptés: PDF, DOC, DOCX, XLS, XLSX, JPG, PNG, MP3, MP4 (Max: 50MB)
          </p>
          <input
            #fileInput
            type="file"
            accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.mp3,.mp4"
            class="hidden"
            (change)="onFileSelected($event)"
          >
        </div>

        <div *ngIf="selectedFile" class="space-y-2">
          <h4 class="text-sm font-medium text-gray-900">Fichier sélectionné:</h4>
          <div class="flex items-center justify-between p-2 bg-gray-50 rounded">
            <span class="text-sm text-gray-700">{{ selectedFile.name }}</span>
            <button
              (click)="removeFile()"
              class="text-red-500 hover:text-red-700"
            >
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-2">
      <button
        (click)="onCancel()"
        class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400"
      >
        Annuler
      </button>
      <button
        (click)="onUpload()"
        [disabled]="canUpload()"
        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Télécharger
      </button>
    </div>
  </div>
</div>
