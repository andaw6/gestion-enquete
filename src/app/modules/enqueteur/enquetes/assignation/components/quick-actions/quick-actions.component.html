<div
  class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-card border border-gray-200/50"
>
  <div
    class="px-6 py-5 border-b border-gray-200/50 bg-gradient-to-r from-gray-50/50 to-gray-100/50 rounded-t-2xl"
  >
    <h3 class="text-lg font-bold text-gray-900 flex items-center">
      <i class="fas fa-bolt text-blue-500 mr-3"></i>
      Actions Rapides
    </h3>
  </div>
  <div class="p-6">
    <div class="space-y-4">
      <button
        *ngFor="let action of quickActions"
        class="w-full flex items-center justify-center px-6 py-4 text-white font-semibold rounded-xl transition-all duration-200 shadow-card card-hover"
        [ngClass]="action.gradient"
        (click)="handleAction(action.label)"
      >
        <i class="text-lg mr-3" [ngClass]="action.icon"></i>
        {{ action.label }}
        <span *ngIf="action.count" class="ml-1">({{ action.count }})</span>
      </button>
    </div>
  </div>
</div>
