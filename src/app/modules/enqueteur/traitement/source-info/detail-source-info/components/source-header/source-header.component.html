<div class="gradient-bg">
  <div class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between">

      <div class="flex items-center  space-x-4">
        <div class="flex items-center ">
          <button
            (click)="goBack()"
            class="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-lg text-white hover:bg-white/30 transition-all duration-200 flex items-center space-x-2 font-medium">
            <i class="fas fa-arrow-left"></i>
            <span>Retour</span>
          </button>

        </div>
        <div>
          <div class="flex items-center space-x-3 mb-2">
            <h1 class="text-2xl font-bold text-white">Source d'Information</h1>
            <span class="status-indicator w-3 h-3 bg-green-400 rounded-full"></span>
          </div>
          <p class="text-blue-100 flex items-center space-x-4">
            <span><i class="fas fa-calendar-alt mr-2"></i>Créé le 16 juin 2024</span>
            <span><i class="fas fa-user-shield mr-2"></i>Niveau de sécurité: Confidentiel</span>
          </p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button
          (click)="onEdit.emit()"
          class="bg-white/20 backdrop-blur-sm px-4 py-2 rounded-lg text-white hover:bg-white/30 transition-all duration-200 flex items-center space-x-2 font-medium">
          <i class="fas fa-edit"></i>
          <span>Modifier</span>
        </button>
      </div>
    </div>
  </div>
</div>
