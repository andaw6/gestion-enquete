<div
  class="bg-card border border-border rounded-xl shadow-professional p-6 animate-slide-up"
>
  <h3 class="text-lg font-heading font-bold text-card-foreground mb-4">
    Actions rapides
  </h3>
  <div class="space-y-2">
    <button
      class="w-full text-left px-4 py-3 text-sm font-medium text-card-foreground hover:bg-muted rounded-lg transition-colors flex items-center group"
      (click)="onAction('approve')"
    >
      <svg
        class="w-4 h-4 mr-3 text-green-600 group-hover:text-green-700"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
      Approuver la demande
    </button>
    <button
      class="w-full text-left px-4 py-3 text-sm font-medium text-card-foreground hover:bg-muted rounded-lg transition-colors flex items-center group"
      (click)="onAction('edit')"
    >
      <svg
        class="w-4 h-4 mr-3 text-secondary group-hover:text-secondary/80"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
        ></path>
      </svg>
      Modifier les détails
    </button>
    <button
      class="w-full text-left px-4 py-3 text-sm font-medium text-card-foreground hover:bg-muted rounded-lg transition-colors flex items-center group"
      (click)="onAction('clarify')"
    >
      <svg
        class="w-4 h-4 mr-3 text-yellow-600 group-hover:text-yellow-700"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
      </svg>
      Demander des clarifications
    </button>
    <button
      class="w-full text-left px-4 py-3 text-sm font-medium text-destructive hover:bg-red-50 rounded-lg transition-colors flex items-center group"
      (click)="onAction('reject')"
    >
      <svg
        class="w-4 h-4 mr-3 text-destructive"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
      Rejeter la demande
    </button>
  </div>
</div>
