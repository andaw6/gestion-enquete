<div class="bg-white rounded-xl shadow-soft border border-gray-100 overflow-hidden">
  <div class="px-6 py-5 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-white">
    <div class="flex items-center justify-between">
      <div class="flex items-center">
        <div [class]="'w-14 h-14 rounded-xl flex items-center justify-center shadow-lg ' + getIconBgClass()">
          <i [class]="investigation.icone + ' text-white text-xl'"></i>
        </div>
        <div class="ml-5">
          <h3 class="text-xl font-bold text-dark-900 mb-1">{{ investigation.nom }}</h3>
          <p class="text-sm text-dark-500 mb-2">{{ investigation.type }} • {{ investigation.documentCount }} documents</p>
          <p class="text-xs text-dark-400 line-clamp-1" *ngIf="investigation.description">{{ investigation.description }}</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <span [class]="'px-3 py-1 text-xs font-semibold rounded-full ' + getStatusClass()">
          {{ getStatusLabel() }}
        </span>
        <button
          (click)="toggleExpansion()"
          class="p-2 hover:bg-gray-100 rounded-lg transition-all duration-200">
          <i [class]="'fas fa-chevron-down text-dark-400 transition-transform duration-300' + (investigation.isExpanded ? ' transform rotate-180' : '')"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="p-6" *ngIf="investigation.isExpanded">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
      <app-document-card
        *ngFor="let document of documents$ | async"
        [document]="document"
        (view)="onViewDocument($event)"
        (download)="onDownloadDocument($event)">
      </app-document-card>
    </div>

    <div class="mt-6 text-center">
      <button class="inline-flex items-center px-4 py-2 text-sm font-medium text-primary-600 hover:text-primary-700 bg-primary-50 hover:bg-primary-100 rounded-lg transition-all duration-200">
        Voir tous les documents ({{ investigation.documentCount }})
        <i class="fas fa-arrow-right ml-2"></i>
      </button>
    </div>
  </div>
</div>
